<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Dungeon Seasons</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

body {
    margin: 0;
    background: #080b12;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

button {
    border: 0;
    color: white;
    background: #202938;
    border-radius: 10px;
    padding: 10px 15px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #334057;
}

#game {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #111722;
}

#hud {
    position: fixed;
    left: 10px;
    top: 10px;
    z-index: 20;
    min-width: 260px;
    pointer-events: none;
}

.hudBox {
    background: rgba(5,8,14,.88);
    border: 1px solid #364153;
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 7px;
    box-shadow: 0 5px 20px rgba(0,0,0,.3);
}

.bar {
    width: 230px;
    height: 12px;
    background: #242b38;
    border-radius: 8px;
    overflow: hidden;
    margin-top: 4px;
}

.bar > div {
    height: 100%;
    transition: width .15s;
}

#hpFill {
    background: linear-gradient(90deg,#e52d27,#ff695e);
}

#xpFill {
    background: linear-gradient(90deg,#2684ff,#7cb7ff);
}

#menus {
    position: fixed;
    right: 10px;
    top: 10px;
    z-index: 30;
    display: flex;
    gap: 6px;
}

#eventBadge {
    position: fixed;
    top: 70px;
    right: 10px;
    z-index: 20;
    background: rgba(80,20,100,.9);
    border: 1px solid #c56cff;
    border-radius: 10px;
    padding: 8px 12px;
}

#message {
    position: fixed;
    left: 50%;
    top: 18%;
    transform: translateX(-50%);
    z-index: 50;
    background: rgba(0,0,0,.8);
    padding: 12px 20px;
    border-radius: 12px;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
}

#panel {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    z-index: 40;
    width: min(900px,94vw);
    max-height: 85vh;
    overflow-y: auto;
    background: rgba(12,17,27,.98);
    border: 1px solid #435069;
    border-radius: 18px;
    padding: 20px;
    display: none;
}

#panel h2 {
    margin-top: 0;
}

.close {
    float: right;
    background: #8f2631;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
    gap: 10px;
}

.card {
    background: #182131;
    border: 1px solid #303c50;
    border-radius: 12px;
    padding: 12px;
}

.card h3 {
    margin: 0 0 8px;
}

.card p {
    color: #b7c1d2;
    font-size: 13px;
}

.locked {
    opacity: .45;
}

.equipped {
    border-color: #5ee77c;
    box-shadow: 0 0 10px rgba(94,231,124,.15);
}

.price {
    color: #ffd84a;
}

.star {
    color: #ffe44e;
}

.coin {
    color: #f6b83c;
}

.lp {
    color: #69b7ff;
}

#mobileControls {
    position: fixed;
    inset: 0;
    z-index: 25;
    pointer-events: none;
}

#joystick {
    position: absolute;
    left: 25px;
    bottom: 25px;
    width: 135px;
    height: 135px;
    border-radius: 50%;
    background: rgba(255,255,255,.09);
    border: 2px solid rgba(255,255,255,.18);
    pointer-events: auto;
}

#stick {
    position: absolute;
    left: 40px;
    top: 40px;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: rgba(255,255,255,.28);
}

#attackButton {
    position: absolute;
    right: 30px;
    bottom: 45px;
    width: 95px;
    height: 95px;
    border-radius: 50%;
    background: rgba(220,50,50,.65);
    border: 3px solid rgba(255,255,255,.35);
    font-size: 17px;
    pointer-events: auto;
}

#dashButton {
    position: absolute;
    right: 140px;
    bottom: 30px;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: rgba(50,130,240,.65);
    pointer-events: auto;
}

@media (min-width: 800px) {
    #mobileControls {
        display: none;
    }
}

@media (max-width: 799px) {
    #hud {
        transform: scale(.85);
        transform-origin: top left;
    }

    #menus {
        flex-wrap: wrap;
        width: 180px;
        justify-content: flex-end;
    }

    #menus button {
        padding: 7px 9px;
        font-size: 11px;
    }

    #eventBadge {
        top: 105px;
    }
}
</style>
</head>

/* =========================================================
   LEVEL SYSTEM
========================================================= */

function xpRequired(level) {
    return level * 5;
}

function addXP(amount) {

    save.xp += amount;

    while (
        save.level < 2000 &&
        save.xp >= xpRequired(save.level)
    ) {

        save.xp -= xpRequired(save.level);

        save.level++;

        save.lp++;

        showMessage(
            `🎉 레벨 업! Lv.${save.level} / LP +1`
        );
    }

    saveGame();
}

function addCoin(amount) {
    save.coin += Math.floor(amount);
    saveGame();
}

function addStar(amount) {
    save.star += Math.floor(amount);
    saveGame();
}

/* =========================================================
   GAME STATE
========================================================= */

const player = {
    x:0,
    y:0,
    radius:18,

    hp:100,
    maxHp:100,

    attackCooldown:0,

    invincible:0,
    dashCooldown:0
};

let enemies = [];
let projectiles = [];
let particles = [];

let dungeon = {
    width:4000,
    height:4000
};

let camera = {
    x:0,
    y:0
};

let keys = {};
let mouse = {
    x:W/2,
    y:H/2,
    down:false
};

let mobileInput = {
    x:0,
    y:0
};

/* =========================================================
   INPUT
========================================================= */

addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    if(e.key === " ") {
        dash();
    }
});

addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener("mousemove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;

/* =========================================================
   MOBILE JOYSTICK
========================================================= */

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let joyActive = false;

function joystickMove(clientX,clientY) {

    const r = joystick.getBoundingClientRect();

    const cx = r.left + r.width/2;
    const cy = r.top + r.height/2;

    let dx = clientX - cx;
    let dy = clientY - cy;

    const max = 45;
    const len = Math.hypot(dx,dy);

    if(len > max) {
        dx = dx / len * max;
        dy = dy / len * max;
    }

    stick.style.left = (40 + dx) + "px";
    stick.style.top = (40 + dy) + "px";

    mobileInput.x = dx / max;
    mobileInput.y = dy / max;
}

function joystickReset() {

    mobileInput.x = 0;
    mobileInput.y = 0;

    stick.style.left = "40px";
    stick.style.top = "40px";
}

joystick.addEventListener("pointerdown", e => {
    joyActive = true;
    joystickMove(e.clientX,e.clientY);
});

addEventListener("pointermove", e => {
    if(joyActive) {
        joystickMove(e.clientX,e.clientY);
    }
});

addEventListener("pointerup", () => {
    if(joyActive) {
        joyActive = false;
        joystickReset();
    }
});

document.getElementById("attackButton")
    .addEventListener("pointerdown", () => {
        attack();
    });

document.getElementById("dashButton")
    .addEventListener("pointerdown", () => {
        dash();
    });

/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function getMovement() {

    let x = 0;
    let y = 0;

    if(keys["w"] || keys["arrowup"]) y -= 1;
    if(keys["s"] || keys["arrowdown"]) y += 1;
    if(keys["a"] || keys["arrowleft"]) x -= 1;
    if(keys["d"] || keys["arrowright"]) x += 1;

    x += mobileInput.x;
    y += mobileInput.y;

    const len = Math.hypot(x,y);

    if(len > 1) {
        x /= len;
        y /= len;
    }

    return {x,y};
}

function playerSpeed() {

    const vehicle =
        VEHICLES.find(v => v.id === save.vehicle);

    return 190 * (vehicle ? vehicle.speed : 1);
}

function updatePlayer(dt) {

    const move = getMovement();

    player.x += move.x * playerSpeed() * dt;
    player.y += move.y * playerSpeed() * dt;

    player.x = Math.max(
        50,
        Math.min(dungeon.width-50,player.x)
    );

    player.y = Math.max(
        50,
        Math.min(dungeon.height-50,player.y)
    );

    if(player.invincible > 0)
        player.invincible -= dt;

    if(player.attackCooldown > 0)
        player.attackCooldown -= dt;

    if(player.dashCooldown > 0)
        player.dashCooldown -= dt;
}

function dash() {

    if(player.dashCooldown > 0)
        return;

    const move = getMovement();

    let x = move.x;
    let y = move.y;

    if(x === 0 && y === 0)
        y = -1;

    player.x += x * 250;
    player.y += y * 250;

    player.invincible = .3;
    player.dashCooldown = 1.5;
}

/* =========================================================
   WEAPON
========================================================= */

function currentWeapon() {
    return WEAPONS.find(w => w.id === save.weapon);
}

function weaponLevel() {
    return save.weaponLevels[save.weapon] || 1;
}

function weaponDamage() {

    const w = currentWeapon();

    return w.damage *
        (1 + (weaponLevel()-1)*.15);
}

function attack() {

    if(player.attackCooldown > 0)
        return;

    const w = currentWeapon();

    player.attackCooldown =
        60 / w.speed;

    let target = null;
    let best = Infinity;

    for(const e of enemies) {

        const dx = e.x-player.x;
        const dy = e.y-player.y;

        const dist = Math.hypot(dx,dy);

        if(dist < best && dist < 550) {
            best = dist;
            target = e;
        }
    }

    if(!target)
        return;

    const dx = target.x-player.x;
    const dy = target.y-player.y;

    const len = Math.hypot(dx,dy);

    const vx = dx/len;
    const vy = dy/len;

    if(w.ranged) {

        projectiles.push({
            x:player.x,
            y:player.y,
            vx:vx*650,
            vy:vy*650,
            damage:weaponDamage(),
            weapon:w.id,
            life:2
        });

    } else {

        if(best < 100) {

            damageEnemy(
                target,
                weaponDamage()
            );

            createParticles(
                target.x,
                target.y,
                "#ffffff",
                8
            );
        }
    }
}

/* =========================================================
   ENEMY SPAWN
========================================================= */

function monsterForLevel() {

    const level = save.level;

    let pool = [];

    if(level < 20) {

        pool = MONSTERS.slice(0,2);

    } else if(level < 50) {

        pool = MONSTERS.slice(0,3);

    } else if(level < 150) {

        pool = MONSTERS.slice(1,5);

    } else if(level < 400) {

        pool = MONSTERS.slice(2,6);

    } else {

        pool = MONSTERS.slice(3);
    }

    return pool[
        Math.floor(Math.random()*pool.length)
    ];
}

function spawnEnemy() {

    const type = monsterForLevel();

    let angle = Math.random()*Math.PI*2;
    let distance = 500 + Math.random()*900;

    let x = player.x + Math.cos(angle)*distance;
    let y = player.y + Math.sin(angle)*distance;

    x = Math.max(80,Math.min(dungeon.width-80,x));
    y = Math.max(80,Math.min(dungeon.height-80,y));

    const scale =
        1 + Math.max(0,save.level-1)*.018;

    enemies.push({
        type:type.id,
        name:type.name,

        x:x,
        y:y,

        hp:type.hp*scale,
        maxHp:type.hp*scale,

        damage:type.damage*scale,
        speed:type.speed,

        xp:type.xp*scale,
        coin:type.coin*scale,

        color:type.color,

        boss:!!type.boss,
        elite:!!type.elite,

        attackCooldown:0,
        revived:false
    });
}

/* =========================================================
   ENEMY AI
========================================================= */

function updateEnemies(dt) {

    for(let i=enemies.length-1;i>=0;i--) {

        const e = enemies[i];

        const dx = player.x-e.x;
        const dy = player.y-e.y;

        const dist = Math.hypot(dx,dy);

        if(dist > 35) {

            e.x += dx/dist*e.speed*dt;
            e.y += dy/dist*e.speed*dt;
        }

        if(e.attackCooldown > 0)
            e.attackCooldown -= dt;

        if(dist < 40 &&
           e.attackCooldown <= 0 &&
           player.invincible <= 0) {

            player.hp -= e.damage;
            e.attackCooldown = 1;

            createParticles(
                player.x,
                player.y,
                "#ff4444",
                6
            );

            if(player.hp <= 0) {

                player.hp = player.maxHp;

                player.x = dungeon.width/2;
                player.y = dungeon.height/2;

                showMessage("💀 쓰러졌지만 다시 일어났습니다!");
            }
        }
    }
}

/* =========================================================
   ENEMY DAMAGE
========================================================= */

function damageEnemy(e,damage) {

    e.hp -= damage;

    if(e.hp <= 0) {

        /*
         * 피닉스는 한 번 부활
         */
        if(e.type === "phoenix" && !e.revived) {

            e.revived = true;
            e.hp = e.maxHp;

            createParticles(
                e.x,
                e.y,
                "#ff9d22",
                40
            );

            showMessage("🔥 피닉스가 부활했습니다!");

            return;
        }

        addXP(Math.floor(e.xp));
        addCoin(Math.floor(e.coin));

        createParticles(
            e.x,
            e.y,
            e.color,
            e.boss ? 40 : 12
        );

        enemies.splice(
            enemies.indexOf(e),
            1
        );

        if(e.boss) {
            showMessage(`👑 ${e.name} 처치!`);
        }
    }
}

/* =========================================================
   PROJECTILES
========================================================= */

function updateProjectiles(dt) {

    for(let i=projectiles.length-1;i>=0;i--) {

        const p = projectiles[i];

        p.x += p.vx*dt;
        p.y += p.vy*dt;

        p.life -= dt;

        let hit = false;

        for(const e of enemies) {

            if(
                Math.hypot(
                    p.x-e.x,
                    p.y-e.y
                ) < 28
            ) {

                damageEnemy(e,p.damage);

                /*
                 * 크리스마스 로켓 스킨
                 * → 양말 + 선물 폭발
                 */
                if(
                    EVENT_MODE === "christmas" &&
                    save.weapon === "rocket"
                ) {
                    createParticles(
                        p.x,
                        p.y,
                        "#ff4b5c",
                        25
                    );
                }

                hit = true;
                break;
            }
        }

        if(
            hit ||
            p.life <= 0 ||
            p.x < 0 ||
            p.y < 0 ||
            p.x > dungeon.width ||
            p.y > dungeon.height
        ) {
            projectiles.splice(i,1);
        }
    }
}

/* =========================================================
   PARTICLES
========================================================= */

function createParticles(x,y,color,count) {

    for(let i=0;i<count;i++) {

        particles.push({
            x:x,
            y:y,

            vx:(Math.random()-.5)*180,
            vy:(Math.random()-.5)*180,

            life:.5+Math.random()*.6,

            color:color,

            size:3+Math.random()*5
        });
    }
}

function updateParticles(dt) {

    for(let i=particles.length-1;i>=0;i--) {

        const p = particles[i];

        p.x += p.vx*dt;
        p.y += p.vy*dt;

        p.vx *= .97;
        p.vy *= .97;

        p.life -= dt;

        if(p.life <= 0)
            particles.splice(i,1);
    }
}

/* =========================================================
   DRAW
========================================================= */

function worldToScreen(x,y) {

    return {
        x:x-camera.x,
        y:y-camera.y
    };
}

function drawBackground() {

    ctx.fillStyle =
        EVENT_MODE === "halloween"
        ? "#17100c"
        : EVENT_MODE === "christmas"
        ? "#0b1720"
        : "#111722";

    ctx.fillRect(0,0,W,H);

    const tile = 80;

    const startX =
        Math.floor(camera.x/tile)*tile;

    const startY =
        Math.floor(camera.y/tile)*tile;

    for(let x=startX;x<camera.x+W+tile;x+=tile) {

        for(let y=startY;y<camera.y+H+tile;y+=tile) {

            const s = worldToScreen(x,y);

            if(
                EVENT_MODE === "christmas"
            ) {

                ctx.fillStyle =
                    ((x/tile+y/tile)%2===0)
                    ? "#152833"
                    : "#13232d";

            } else if(
                EVENT_MODE === "halloween"
            ) {

                ctx.fillStyle =
                    ((x/tile+y/tile)%2===0)
                    ? "#24170f"
                    : "#1e140e";

            } else {

                ctx.fillStyle =
                    ((x/tile+y/tile)%2===0)
                    ? "#171f2b"
                    : "#141b25";
            }

            ctx.fillRect(
                s.x,
                s.y,
                tile,
                tile
            );
        }
    }
}

function drawPlayer() {

    const p = worldToScreen(
        player.x,
        player.y
    );

    ctx.save();

    if(player.invincible > 0) {
        ctx.globalAlpha = .5;
    }

    /*
     * 몸
     */
    ctx.fillStyle = "#4d8cff";

    ctx.beginPath();
    ctx.arc(
        p.x,
        p.y,
        player.radius,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
     * 얼굴
     */
    ctx.fillStyle = "#ffd3ad";

    ctx.beginPath();
    ctx.arc(
        p.x,
        p.y-4,
        10,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
     * 머리 장식
     */
    const head =
        save.equippedCosmetics.head;

    if(head === "santaHat") {

        ctx.fillStyle = "#e53935";

        ctx.fillRect(
            p.x-12,
            p.y-24,
            24,
            13
        );

        ctx.fillStyle = "#fff";

        ctx.fillRect(
            p.x-13,
            p.y-27,
            26,
            5
        );

    } else if(head === "pumpkin") {

        ctx.fillStyle = "#ff8b1a";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y-7,
            13,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle = "#111";

        ctx.fillRect(
            p.x-7,
            p.y-10,
            4,
            4
        );

        ctx.fillRect(
            p.x+3,
            p.y-10,
            4,
            4
        );
    }

    ctx.restore();
}

function drawVehicle() {

    const vehicle =
        VEHICLES.find(v => v.id === save.vehicle);

    if(!vehicle)
        return;

    const p = worldToScreen(
        player.x,
        player.y
    );

    /*
     * 탈것은 캐릭터 뒤쪽에 표시
     */

    ctx.save();

    if(save.vehicle === "bike") {

        ctx.strokeStyle="#bbb";
        ctx.lineWidth=4;

        ctx.beginPath();
        ctx.arc(
            p.x-16,
            p.y+16,
            10,
            0,
            Math.PI*2
        );
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(
            p.x+16,
            p.y+16,
            10,
            0,
            Math.PI*2
        );
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(p.x-16,p.y+16);
        ctx.lineTo(p.x,p.y);
        ctx.lineTo(p.x+16,p.y+16);
        ctx.stroke();

    } else if(save.vehicle === "car") {

        ctx.fillStyle =
            EVENT_MODE === "christmas"
            ? "#d83434"
            : "#4285f4";

        ctx.fillRect(
            p.x-30,
            p.y+8,
            60,
            22
        );

        ctx.fillStyle="#111";

        ctx.beginPath();
        ctx.arc(p.x-18,p.y+31,7,0,Math.PI*2);
        ctx.arc(p.x+18,p.y+31,7,0,Math.PI*2);
        ctx.fill();

        /*
         * 산타 썰매 스킨
         */
        if(
            EVENT_MODE === "christmas" &&
            save.vehicle === "car"
        ) {

            ctx.fillStyle="#ffd33d";

            ctx.fillRect(
                p.x-20,
                p.y+4,
                40,
                6
            );
        }

    } else if(save.vehicle === "plane") {

        ctx.fillStyle="#aaa";

        ctx.beginPath();

        ctx.moveTo(p.x+35,p.y);
        ctx.lineTo(p.x-25,p.y-15);
        ctx.lineTo(p.x-10,p.y);
        ctx.lineTo(p.x-25,p.y+15);
        ctx.closePath();

        ctx.fill();

    } else if(save.vehicle === "fighter") {

        ctx.fillStyle="#707b8c";

        ctx.beginPath();

        ctx.moveTo(p.x+42,p.y);
        ctx.lineTo(p.x-25,p.y-12);
        ctx.lineTo(p.x-8,p.y);
        ctx.lineTo(p.x-25,p.y+12);
        ctx.closePath();

        ctx.fill();

        ctx.fillStyle="#e83b3b";

        ctx.fillRect(
            p.x-5,
            p.y-3,
            22,
            6
        );
    }

    ctx.restore();
}

function drawEnemies() {

    for(const e of enemies) {

        const p = worldToScreen(
            e.x,
            e.y
        );

        /*
         * 크리스마스 이벤트 몬스터 장식
         */
        let color = e.color;

        ctx.save();

        if(EVENT_MODE === "christmas") {

            if(e.type === "slime") {

                color = "#63e5ff";

            } else if(e.type === "goblin") {

                color = "#67d6a0";
            }
        }

        /*
         * 할로윈
         */
        if(EVENT_MODE === "halloween") {

            if(e.type === "slime")
                color = "#ff8b1c";

            if(e.type === "goblin")
                color = "#6d3d9d";
        }

        ctx.fillStyle=color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            e.boss ? 38 :
            e.elite ? 28 :
            22,
            0,
            Math.PI*2
        );

        ctx.fill();

        /*
         * HP 바
         */
        const barW =
            e.boss ? 90 :
            e.elite ? 65 :
            45;

        ctx.fillStyle="#111";

        ctx.fillRect(
            p.x-barW/2,
            p.y-48,
            barW,
            6
        );

        ctx.fillStyle="#ff4242";

        ctx.fillRect(
            p.x-barW/2,
            p.y-48,
            barW*(e.hp/e.maxHp),
            6
        );

        ctx.fillStyle="#fff";

        ctx.font =
            e.boss ? "bold 14px Arial" :
            "11px Arial";

        ctx.textAlign="center";

        ctx.fillText(
            e.name,
            p.x,
            p.y-55
        );

        ctx.restore();
    }
}

function drawProjectiles() {

    for(const p of projectiles) {

        const s =
            worldToScreen(p.x,p.y);

        let text = "●";

        if(
            EVENT_MODE === "christmas" &&
            p.weapon === "rocket"
        ) {
            text = "🧦";
        } else if(p.weapon === "rocket") {
            text = "🚀";
        } else if(p.weapon === "zeus") {
            text = "⚡";
        } else if(p.weapon === "poseidon") {
            text = "🔱";
        } else if(p.weapon === "pen") {
            text = "🖊️";
        }

        ctx.font="24px Arial";
        ctx.textAlign="center";

        ctx.fillText(
            text,
            s.x,
            s.y
        );
    }
}

function drawParticles() {

    for(const p of particles) {

        const s =
            worldToScreen(p.x,p.y);

        ctx.globalAlpha =
            Math.max(0,p.life);

        ctx.fillStyle=p.color;

        ctx.fillRect(
            s.x,
            s.y,
            p.size,
            p.size
        );
    }

    ctx.globalAlpha=1;
}

function render() {

    drawBackground();

    /*
     * 카메라
     */
    camera.x =
        player.x-W/2;

    camera.y =
        player.y-H/2;

    camera.x =
        Math.max(
            0,
            Math.min(
                dungeon.width-W,
                camera.x
            )
        );

    camera.y =
        Math.max(
            0,
            Math.min(
                dungeon.height-H,
                camera.y
            )
        );

    drawVehicle();
    drawEnemies();
    drawProjectiles();
    drawParticles();
    drawPlayer();
}

   UI

function updateHUD() {

    document.getElementById("levelText")
        .textContent =
        `Lv. ${save.level} / 2000`;

    document.getElementById("hpText")
        .textContent =
        `${Math.floor(player.hp)} / ${player.maxHp}`;

    document.getElementById("coinText")
        .textContent =
        save.coin.toLocaleString();

    document.getElementById("lpText")
        .textContent =
        save.lp.toLocaleString();

    document.getElementById("starText")
        .textContent =
        save.star.toLocaleString();

    document.getElementById("weaponText")
        .textContent =
        displayedWeaponName();

    const vehicle =
        VEHICLES.find(v => v.id === save.vehicle);

    document.getElementById("vehicleText")
        .textContent =
        displayedVehicleName(vehicle);

    const need =
        xpRequired(save.level);

    document.getElementById("xpText")
        .textContent =
        `${Math.floor(save.xp).toLocaleString()} / ${need.toLocaleString()}`;

    document.getElementById("xpFill")
        .style.width =
        Math.min(
            100,
            save.xp/need*100
        ) + "%";

    document.getElementById("hpFill")
        .style.width =
        Math.max(
            0,
            player.hp/player.maxHp*100
        ) + "%";
}

function displayedWeaponName() {

    const w = currentWeapon();

    if(
        EVENT_MODE === "christmas" &&
        w.skin &&
        w.skin.event === "christmas"
    ) {
        return w.skin.name;
    }

    return w.name;
}

function displayedVehicleName(v) {

    if(
        EVENT_MODE === "christmas" &&
        v &&
        v.skin &&
        v.skin.event === "christmas"
    ) {
        return v.skin.name;
    }

    return v ? v.name : "";
}

function showMessage(text) {

    const el =
        document.getElementById("message");

    el.textContent=text;
    el.style.opacity=1;

    clearTimeout(showMessage.timer);

    showMessage.timer =
        setTimeout(() => {
            el.style.opacity=0;
        },2000);
}

/* =========================================================
   PANELS
========================================================= */

function openPanel(type) {

    const panel =
        document.getElementById("panel");

    panel.style.display="block";

    if(type === "shop")
        panel.innerHTML = shopHTML();

    if(type === "inventory")
        panel.innerHTML = inventoryHTML();

    if(type === "character")
        panel.innerHTML = characterHTML();

    if(type === "info")
        panel.innerHTML = infoHTML();
}

function closePanel() {

    document.getElementById("panel")
        .style.display="none";
}

function upgradeCost(id) {

    const level =
        save.weaponLevels[id] || 1;

    return Math.floor(
        100 * level * level
    );
}

function buyWeapon(id) {

    const w =
        WEAPONS.find(x => x.id === id);

    if(save.weaponsOwned.includes(id)) {
        showMessage("이미 가지고 있습니다.");
        return;
    }

    if(save.coin < w.cost) {
        showMessage("🪙 코인이 부족합니다.");
        return;
    }

    save.coin -= w.cost;

    save.weaponsOwned.push(id);

    save.weaponLevels[id]=1;

    saveGame();

    showMessage(`${w.name} 구매 완료!`);

    openPanel("shop");
}

function equipWeapon(id) {

    if(!save.weaponsOwned.includes(id))
        return;

    save.weapon=id;

    saveGame();

    showMessage(
        `${displayedWeaponName()} 장착!`
    );

    openPanel("inventory");
}

function upgradeWeapon(id) {

    if(!save.weaponsOwned.includes(id))
        return;

    const level =
        save.weaponLevels[id] || 1;

    if(level >= 100) {
        showMessage("최대 강화 레벨입니다.");
        return;
    }

    const cost =
        upgradeCost(id);

    if(save.coin < cost) {
        showMessage("🪙 코인이 부족합니다.");
        return;
    }

    save.coin -= cost;

    save.weaponLevels[id]=level+1;

    saveGame();

    showMessage(
        `⚔️ 무기 강화! Lv.${level+1}`
    );

    openPanel("shop");
}

function buyVehicle(id) {

    const v =
        VEHICLES.find(x => x.id === id);

    if(save.vehicleOwned.includes(id))
        return;

    if(save.star < v.cost) {
        showMessage("⭐ Star가 부족합니다.");
        return;
    }

    save.star -= v.cost;

    save.vehicleOwned.push(id);

    saveGame();

    showMessage(`${v.name} 구매 완료!`);

    openPanel("shop");
}

function equipVehicle(id) {

    if(!save.vehicleOwned.includes(id))
        return;

    save.vehicle=id;

    saveGame();

    showMessage(
        `${displayedVehicleName(
            VEHICLES.find(v=>v.id===id)
        )} 장착!`
    );

    openPanel("shop");
}

function buySpecial(type) {

    if(EVENT_MODE !== "christmas") {

        showMessage(
            "🎄 크리스마스 이벤트 기간에만 구매할 수 있습니다."
        );

        return;
    }

    const prices = {
        christmasWeapon:150,
        sockLauncher:500,
        santaSleigh:300
    };

    const price = prices[type];

    if(save.star < price) {

        showMessage("⭐ Star가 부족합니다.");

        return;
    }

    save.star -= price;

    showMessage(
        "🎁 크리스마스 한정 아이템 획득!"
    );

    saveGame();

    openPanel("shop");
}

/* =========================================================
   DAILY SHOP
========================================================= */

function dailySeed() {

    const today =
        new Date().toISOString().slice(0,10);

    let hash=0;

    for(const c of today)
        hash =
            ((hash<<5)-hash)+c.charCodeAt(0);

    return Math.abs(hash);
}

function dailyShopHTML() {

    const seed=dailySeed();

    const items = [

            rarity:"희귀",
            chance:25
        },
        {

            price:100,
            rarity:"한정",
            chance:10
        },
        {
            name:"초희귀 한정 아이템",
            price:300,
            rarity:"초희귀",
            chance:5
        }
    ];

    /*
     * 날짜 기반으로 상품 선정
     */
    const item =
        items[
            seed % items.length
        ];

    return `
        <div class="card">
            <h3>🎁 오늘의 상품</h3>

            <p>
                상품 등급:
                <b>${item.rarity}</b>
            </p>

            <p>
                등장 확률:
                ${item.chance}%
            </p>

            <p>
                ⭐ ${item.price}
            </p>

            <button onclick="buyDaily('${item.name}',${item.price})">
                구매
            </button>

            <p>
                ※ 매일 00:00에 상품이 변경됩니다.
            </p>
        </div>
    `;
}

function buyDaily(name,price) {

    if(save.star < price) {

        showMessage("⭐ Star가 부족합니다.");

        return;
    }

    save.star -= price;

    showMessage(
        `🎁 ${name} 획득!`
    );

    saveGame();

    openPanel("shop");
}

/* =========================================================
   INVENTORY
========================================================= */

function inventoryHTML() {

    let html = `
        <button class="close"
                onclick="closePanel()">X</button>

        <h2>🎒 장비</h2>

        <h3>무기</h3>

        <div class="grid">
    `;

    for(const id of save.weaponsOwned) {

        const w =
            WEAPONS.find(x=>x.id===id);

        const level =
            save.weaponLevels[id] || 1;

        html += `
            <div class="card ${
                save.weapon===id
                ? "equipped"
                : ""
            }">

                <h3>${w.name}</h3>

                <p>강화 Lv.${level}</p>

                <p>
                    공격력:
                    ${Math.floor(
                        w.damage*(1+(level-1)*.15)
                    )}
                </p>

                <button onclick="equipWeapon('${id}')">
                    ${save.weapon===id ? "장착 중" : "장착"}
                </button>

            </div>
        `;
    }

    html += `
        </div>

        <h3>탈것</h3>

        <div class="grid">
    `;

    for(const id of save.vehicleOwned) {

        const v =
            VEHICLES.find(x=>x.id===id);

        html += `
            <div class="card ${
                save.vehicle===id
                ? "equipped"
                : ""
            }">

                <h3>${displayedVehicleName(v)}</h3>

                <p>
                    속도 ×${v.speed}
                </p>

                <button onclick="equipVehicle('${id}')">
                    ${save.vehicle===id
                    ? "장착 중"
                    : "장착"}
                </button>

            </div>
        `;
    }

    html += `</div>`;

    return html;
}

/* =========================================================
   CHARACTER
========================================================= */

function characterHTML() {

    let html = `
        <button class="close"
                onclick="closePanel()">X</button>

        <h2>👤 캐릭터 꾸미기</h2>

        <div class="grid">
    `;

    for(const c of COSMETICS) {

        const owned =
            save.cosmeticsOwned.includes(c.id);

        const eventAvailable =
            !c.event ||
            c.event === EVENT_MODE;

        html += `
            <div class="card ${
                owned &&
                (
                    save.equippedCosmetics.head===c.id ||
                    save.equippedCosmetics.skin===c.id ||
                    save.equippedCosmetics.back===c.id
                )
                ? "equipped"
                : ""
            } ${
                !eventAvailable
                ? "locked"
                : ""
            }">

                <h3>${c.name}</h3>

                <p>
                    종류: ${c.type}
                </p>

                ${
                    c.event
                    ? `<p>이벤트: ${c.event}</p>`
                    : ""
                }

                ${
                    owned
                    ? `
                    <button onclick="equipCosmetic('${c.id}')">
                        장착
                    </button>
                    `
                    : `
                    <p class="star">
                        ⭐ ${c.cost}
                    </p>

                    <button onclick="buyCosmetic('${c.id}')"
                        ${!eventAvailable ? "disabled":""}>
                        구매
                    </button>
                    `
                }
            </div>
        `;
    }

    html += `
        </div>
    `;

    return html;
}

function buyCosmetic(id) {

    const c =
        COSMETICS.find(x=>x.id===id);

    if(c.event && c.event !== EVENT_MODE) {

        showMessage(
            "현재 이벤트에서 판매하지 않습니다."
        );

        return;
    }

    if(save.cosmeticsOwned.includes(id))
        return;

    if(save.star < c.cost) {

        showMessage("⭐ Star가 부족합니다.");

        return;
    }

    save.star -= c.cost;

    save.cosmeticsOwned.push(id);

    saveGame();

    showMessage(`${c.name} 획득!`);

    openPanel("character");
}

function equipCosmetic(id) {

    const c =
        COSMETICS.find(x=>x.id===id);

    if(!save.cosmeticsOwned.includes(id))
        return;

    if(c.type === "skin")
        save.equippedCosmetics.skin=id;

    if(c.type === "head")
        save.equippedCosmetics.head=id;

    if(c.type === "back")
        save.equippedCosmetics.back=id;

    saveGame();

    showMessage(`${c.name} 장착!`);

    openPanel("character");
}

/* =========================================================
   GAME LOOP
========================================================= */

let lastTime = performance.now();

function gameLoop(now) {

    const dt =
        Math.min(
            .05,
            (now-lastTime)/1000
        );

    lastTime=now;

    updatePlayer(dt);
    updateEnemies(dt);
    updateProjectiles(dt);
    updateParticles(dt);

    /*
     * 적 자동 생성
     */
    const maxEnemies =
        8 +
        Math.floor(save.level/50);

    if(
        enemies.length < Math.min(maxEnemies,25)
    ) {
        spawnEnemy();
    }

    /*
     * 자동 공격이 아니라
     * PC 마우스 홀드 시 공격
     */
    if(mouse.down)
        attack();

    render();
    updateHUD();

    requestAnimationFrame(gameLoop);
}

/* =========================================================
   INITIALIZE
========================================================= */

player.x=dungeon.width/2;
player.y=dungeon.height/2;

for(let i=0;i<7;i++)
    spawnEnemy();

updateHUD();

requestAnimationFrame(gameLoop);

/* =========================================================
   DEVELOPMENT COMMANDS
   브라우저 콘솔에서 테스트 가능
========================================================= */

window.game = {

    addXP(amount) {
        addXP(amount);
    },

    addCoin(amount) {
        addCoin(amount);
    },

    addStar(amount) {
        addStar(amount);
    },

    levelUp() {
        if(save.level < 2000) {
            save.level++;
            save.lp++;
            saveGame();
        }
    },

    reset() {
        localStorage.removeItem(
            "dungeonSeasonsSave"
        );

        location.reload();
    },

    setLevel(level) {
        save.level =
            Math.max(
                1,
                Math.min(2000,level)
            );

        saveGame();
    }
};
</script>
