    background:rgba(7,11,18,.91);

.bar{
    width:100%;

    background:#202837;
    border-radius:8px;
    overflow:hidden;
}

    position:fixed;
    right:10px;

    z-index:30;

#event{
    position:fixed;
    right:10px;
    top:65px;
    z-index:20;
    padding:8px 12px;
    border-radius:10px;
    background:rgba(30,30,40,.9);

#message{
    position:fixed;

    top:17%;

function startOfWeek(date){

    const d=new Date(date);

    const day=d.getDay();

    const diff=day===0 ? -6 : 1-day;

    d.setDate(d.getDate()+diff);

    d.setHours(0,0,0,0);

    return d;
}

function endOfWeek(date){

    const d=startOfWeek(date);

    d.setDate(d.getDate()+6);

    d.setHours(23,59,59,999);

    return d;
}

function eventActive(month,day){

    const year=new Date().getFullYear();

    const eventDate=
        new Date(year,month-1,day);

    const now=new Date();

    return (
        now>=startOfWeek(eventDate) &&
        now<=endOfWeek(eventDate)
    );
}

function getSeason(){

    if(eventActive(10,31))
        return "halloween";

    if(eventActive(12,25))
        return "christmas";

    return "normal";
}

const joystick=

let joystickActive=false;

function updateJoystick(x,y){

 const r=
  joystick.getBoundingClientRect();

 const cx=r.left+r.width/2;
 const cy=r.top+r.height/2;

 let dx=x-cx;
 let dy=y-cy;

 const max=45;

 const len=Math.hypot(dx,dy);

 if(len>max){

  dx=dx/len*max;
  dy=dy/len*max;

 }

 stick.style.left=
  (40+dx)+"px";

 stick.style.top=
  (40+dy)+"px";

 mobile.x=dx/max;
 mobile.y=dy/max;

}

joystick.addEventListener(
 "pointerdown",
 e=>{

  joystickActive=true;

  updateJoystick(
   e.clientX,
   e.clientY
  );

 }
);

addEventListener(
 "pointermove",
 e=>{

  if(joystickActive){

   updateJoystick(
    e.clientX,
    e.clientY
   );

  }

 }
);

addEventListener(
 "pointerup",
 ()=>{

  joystickActive=false;

  mobile.x=0;
  mobile.y=0;

 let x=0;
 let y=0;

 if(keys["w"]||keys["arrowup"])
  y--;

 if(keys["s"]||keys["arrowdown"])
  y++;

 if(keys["a"]||keys["arrowleft"])
  x--;

 if(keys["d"]||keys["arrowright"])
  x++;

 x+=mobile.x;
 y+=mobile.y;

 const len=Math.hypot(x,y);

 if(len>1){

  x/=len;
  y/=len;

 }

 return {x,y};
}

function currentVehicle(){

 return VEHICLES.find(
  v=>v.id===save.vehicle
 );
}

function moveSpeed(){

 const v=currentVehicle();

 return 190*(v?v.speed:1);
}

function updatePlayer(dt){

 const m=movement();

 player.x+=m.x*moveSpeed()*dt;
 player.y+=m.y*moveSpeed()*dt;

 player.x=Math.max(
  30,
  Math.min(
   WORLD.width-30,
   player.x
  )
 );

 player.y=Math.max(
  30,
  Math.min(
   WORLD.height-30,
   player.y
  )
 );

 if(player.attackCooldown>0)
  player.attackCooldown-=dt;

 if(player.dashCooldown>0)
  player.dashCooldown-=dt;

 if(player.invincible>0)
  player.invincible-=dt;
}


function dash(){

 if(player.dashCooldown>0)
  return;

 const m=movement();

 let x=m.x;
 let y=m.y;

 if(x===0&&y===0)
  y=-1;

 player.x+=x*250;
 player.y+=y*250;

 player.x=Math.max(
  30,
  Math.min(WORLD.width-30,player.x)
 );

 player.y=Math.max(
  30,
  Math.min(WORLD.height-30,player.y)
 );

 player.invincible=.35;

 player.dashCooldown=1.5;
}


/* =========================================================
   WEAPON
========================================================= */

function currentWeapon(){

 return WEAPONS.find(
  w=>w.id===save.weapon
 );
}

function weaponLevel(){

 return save.weaponLevels[
  save.weapon
 ]||1;
}

function weaponDamage(){

 const w=currentWeapon();

 return w.damage*
  (1+(weaponLevel()-1)*.15);
}

function attack(){

 if(player.attackCooldown>0)
  return;

 const w=currentWeapon();

 player.attackCooldown=
  60/w.speed;

 let target=null;
 let best=Infinity;

 for(const e of enemies){

  const d=Math.hypot(
   e.x-player.x,
   e.y-player.y
  );

  if(
   d<best &&
   d<=520
  ){

   best=d;
   target=e;

  }

 }

 if(!target)
  return;

 const dx=target.x-player.x;
 const dy=target.y-player.y;

 const len=Math.hypot(dx,dy);

 const vx=dx/len;
 const vy=dy/len;

 if(w.ranged){

  projectiles.push({

   x:player.x,
   y:player.y,

   vx:vx*650,
   vy:vy*650,

   damage:weaponDamage(),

   weapon:w.id,

   life:2

  });

 }else{

  if(best<=110){

   damageEnemy(
    target,
    weaponDamage()
   );

  }

 }

}


/* =========================================================
   MONSTER SELECTION
========================================================= */

function monsterType(){

 let pool;

 const l=save.level;

 if(l<20)
  pool=MONSTERS.slice(0,2);

 else if(l<50)
  pool=MONSTERS.slice(0,3);

 else if(l<150)
  pool=MONSTERS.slice(1,5);

 else if(l<400)
  pool=MONSTERS.slice(3,6);

 else
  pool=MONSTERS.slice(3);

 /*
  * 지형에 따른 특수 몬스터
  */

 const biome=getBiome(
  player.x,
  player.y
 );

 if(
  biome &&
  (biome.id==="hell"||
   biome.id==="volcano")
 ){

  pool=MONSTERS.slice(4);
 }

 return pool[
  Math.floor(
   Math.random()*pool.length
  )
 ];
}


function spawnEnemy(){

 const type=monsterType();

 const angle=
  Math.random()*Math.PI*2;

 const distance=
  500+Math.random()*700;

 let x=
  player.x+
  Math.cos(angle)*distance;

 let y=
  player.y+
  Math.sin(angle)*distance;

 x=Math.max(
  50,
  Math.min(WORLD.width-50,x)
 );

 y=Math.max(
  50,
  Math.min(WORLD.height-50,y)
 );

 const scale=
  1+
  (save.level-1)*.018;

 enemies.push({

  type:type.id,

  name:type.name,

  x:x,
  y:y,

  hp:type.hp*scale,
  maxHp:type.hp*scale,

  damage:type.damage*scale,

  speed:type.speed,

  xp:type.xp*scale,
  coin:type.coin*scale,

  color:type.color,

  elite:!!type.elite,
  boss:!!type.boss,

  attackCooldown:0,

  revived:false

 });

}


/* =========================================================
   ENEMY AI
========================================================= */

function updateEnemies(dt){

 for(
  let i=enemies.length-1;
  i>=0;
  i--
 ){

  const e=enemies[i];

  const dx=
   player.x-e.x;

  const dy=
   player.y-e.y;

  const d=
   Math.hypot(dx,dy);

  if(d>42){

   e.x+=
    dx/d*e.speed*dt;

   e.y+=
    dy/d*e.speed*dt;

  }

  if(e.attackCooldown>0)
   e.attackCooldown-=dt;

  if(
   d<42 &&
   e.attackCooldown<=0 &&
   player.invincible<=0
  ){

   player.hp-=e.damage;

   e.attackCooldown=1;

   createParticles(
    player.x,
    player.y,
    "#ff4545",
    8
   );

   if(player.hp<=0){

    player.hp=player.maxHp;

    player.x=700;
    player.y=2000;

    showMessage(
     "💀 쓰러졌습니다!"
    );

   }

  }

 }

}


/* =========================================================
   DAMAGE
========================================================= */

function damageEnemy(e,damage){

 e.hp-=damage;

 createParticles(
  e.x,
  e.y,
  e.color,
  5
 );

 if(e.hp>0)
  return;

 /*
  * 피닉스 부활
  */

 if(
  e.type==="phoenix" &&
  !e.revived
 ){

  e.revived=true;

  e.hp=e.maxHp;

  createParticles(
   e.x,
   e.y,
   "#ff9b1e",
   50
  );

  showMessage(
   "🔥 피닉스가 부활했습니다!"
  );

  return;
 }

 addXP(e.xp);
 save.coin+=Math.floor(e.coin);

 if(e.boss){

  save.star+=5;

  showMessage(
   `👑 ${e.name} 처치! ⭐ +5`
  );

 }

 enemies.splice(
  enemies.indexOf(e),
  1
 );

 saveGame();

}


/* =========================================================
   PROJECTILES
========================================================= */

function updateProjectiles(dt){

 for(
  let i=projectiles.length-1;
  i>=0;
  i--
 ){

  const p=projectiles[i];

  p.x+=p.vx*dt;
  p.y+=p.vy*dt;

  p.life-=dt;

  let hit=false;

  for(const e of enemies){

   if(
    Math.hypot(
     p.x-e.x,
     p.y-e.y
    )<28
   ){

    damageEnemy(
     e,
     p.damage
    );

    hit=true;

    createParticles(
     p.x,
     p.y,
     "#fff",
     12
    );

    break;
   }

  }

  if(
   hit||
   p.life<=0||
   p.x<0||
   p.y<0||
   p.x>WORLD.width||
   p.y>WORLD.height
  ){

   projectiles.splice(i,1);

  }

 }

}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles(
 x,y,color,count
){

 for(let i=0;i<count;i++){

  particles.push({

   x:x,
   y:y,

   vx:(Math.random()-.5)*180,
   vy:(Math.random()-.5)*180,

   life:.4+Math.random()*.7,

   color:color,

   size:3+Math.random()*5

  });

 }

}

function updateParticles(dt){

 for(
  let i=particles.length-1;
  i>=0;
  i--
 ){

  const p=particles[i];

  p.x+=p.vx*dt;
  p.y+=p.vy*dt;

  p.vx*=.97;
  p.vy*=.97;

  p.life-=dt;

  if(p.life<=0)
   particles.splice(i,1);

 }

}


/* =========================================================
   BIOME
========================================================= */

function getBiome(x,y){

 for(const b of BIOMES){

  if(
   x>=b.x &&
   x<=b.x+b.w &&
   y>=b.y &&
   y<=b.y+b.h
  )
   return b;

 }

 return BIOMES[0];
}


/* =========================================================
   DRAW MAP
========================================================= */

function drawMap(){

 for(const b of BIOMES){

  const x=b.x-camera.x;
  const y=b.y-camera.y;

  ctx.fillStyle=b.color;

  ctx.fillRect(
   x,
   y,
   b.w,
   b.h
  );

 }

 /*
  * 물결
  */

 ctx.globalAlpha=.15;

 for(
  let x=Math.floor(camera.x/60)*60;
  x<camera.x+W;
  x+=60
 ){

  for(
   let y=Math.floor(camera.y/60)*60;
   y<camera.y+H;
   y+=60
  ){

   const b=getBiome(x,y);

   if(
    b.id==="ocean"||
    b.id==="lake"
   ){

    ctx.strokeStyle="#fff";

    ctx.beginPath();

    ctx.moveTo(
     x-camera.x,
     y-camera.y
    );

    ctx.lineTo(
     x-camera.x+30,
     y-camera.y
    );

    ctx.stroke();

   }

  }

 }

 ctx.globalAlpha=1;

 /*
  * 나무
  */

 for(let i=0;i<70;i++){

  const x=
   (i*347)%WORLD.width;

  const y=
   (i*587)%WORLD.height;

  const b=getBiome(x,y);

  if(
   b.id==="jungle"||
   b.id==="grass"
  ){

   const sx=x-camera.x;
   const sy=y-camera.y;

   ctx.fillStyle="#69432a";

   ctx.fillRect(
    sx-4,
    sy,
    8,
    24
   );

   ctx.fillStyle=
    b.id==="jungle"
    ? "#19a84d"
    : "#4bbf50";

   ctx.beginPath();

   ctx.arc(
    sx,
    sy-5,
    18,
    0,
    Math.PI*2
   );

   ctx.fill();

  }

 }

}

  ctx.fill();

 }else{

  ctx.beginPath();

  ctx.arc(
   sx,
   sy,
   r,
   0,
   Math.PI*2
  );

  ctx.fill();

 }

 /*
  * 눈
  */

 ctx.fillStyle="#fff";

 ctx.fillRect(
  sx-8,
  sy-5,
  5,
  5
 );

 ctx.fillRect(
  sx+3,
  sy-5,
  5,
  5
 );

 /*
  * HP
  */

 const bw=
  e.boss
  ? 100
  : e.elite
  ? 70
  : 50;

 ctx.fillStyle="#111";

 ctx.fillRect(
  sx-bw/2,
  sy-r-18,
  bw,
  6
 );

 ctx.fillStyle="#ff4141";

 ctx.fillRect(
  sx-bw/2,
  sy-r-18,
  bw*Math.max(
   0,e.hp/e.maxHp
  ),
  6
 );

 ctx.fillStyle="#fff";

 ctx.font=
  e.boss
  ? "bold 14px Arial"
  : "11px Arial";

 ctx.textAlign="center";

 ctx.fillText(
  e.name,
  sx,
  sy-r-24
 );

 ctx.restore();

}


function drawEnemies(){

 for(const e of enemies)
  drawEnemy(e);

}

========================================================= */

function drawProjectiles(){

 for(const p of projectiles){

  const sx=p.x-camera.x;
  const sy=p.y-camera.y;

  let text="●";

  if(
   p.weapon==="rocket" &&
   SEASON==="christmas"
  )
   text="🧦";

  else if(p.weapon==="rocket")
   text="🚀";

  else if(p.weapon==="zeus")
   text="⚡";

  else if(p.weapon==="poseidon")
   text="🔱";

  else if(p.weapon==="pen")
   text="🖊️";

  ctx.font="23px Arial";
  ctx.textAlign="center";

  ctx.fillText(
   text,
   sx,
   sy
  );

 }

}


/* =========================================================
   PARTICLES DRAW
========================================================= */

function drawParticles(){

 for(const p of particles){

  const sx=p.x-camera.x;
  const sy=p.y-camera.y;

  ctx.globalAlpha=
   Math.max(0,p.life);

  ctx.fillStyle=p.color;

  ctx.fillRect(
   sx,
   sy,
   p.size,
   p.size
  );

 }

 ctx.globalAlpha=1;

}

function todayKey(){

 const d=new Date();

 return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;

}


/*
 * 하루에 5개 상품을 모두 보여주되
 * 등장 여부를 확률로 결정.
 */

function dailyProducts(){

 const day=todayKey();

 let seed=0;

 for(const c of day){

  seed=
   (seed*31+c.charCodeAt(0))>>>0;

 }

 const products=[];

 for(let i=0;i<5;i++){

  /*
   * 결정론적 랜덤
   */

  seed=
   (seed*1664525+1013904223)>>>0;

  const roll=
   seed%100;

  const item=
   DAILY_ITEMS[i];

  let available=
   roll<item.chance;

  /*
   * 일반 아이템은 항상 일정 확률로 등장
   * 이벤트가 아닌 한정 스킨은 이벤트 주에만 등장
   */

  if(item.event){

   if(
    item.event!==SEASON
   ){

    available=false;

   }

  }

  products.push({

   ...item,

   available

  });

 }

 /*
  * 너무 적게 나오는 것을 방지
  */

 if(
  products.filter(x=>x.available).length<2
 ){

  products[0].available=true;
  products[1].available=true;

 }

 return products;

}

  html+=`

/* =========================================================
   SPAWN
========================================================= */

player.x=700;
player.y=2000;

for(let i=0;i<8;i++)
 spawnEnemy();


/* =========================================================
   GAME LOOP
========================================================= */

let last=performance.now();

function gameLoop(now){

 const dt=
  Math.min(
   .05,
   (now-last)/1000
  );

 last=now;

 updatePlayer(dt);
 updateEnemies(dt);
 updateProjectiles(dt);
 updateParticles(dt);

 /*
  * 적 수
  */

 const maxEnemies=
  Math.min(
   25,
   8+
   Math.floor(
    save.level/50
   )
  );

 if(
  enemies.length<maxEnemies
 )
  spawnEnemy();

 render();
 updateHUD();

 requestAnimationFrame(
  gameLoop
 );

}

updateHUD();

requestAnimationFrame(
 gameLoop
);


/* =========================================================
   TEST COMMANDS
========================================================= */

window.game={

 addXP(amount){

  addXP(amount);
 },

 addCoin(amount){

  save.coin+=amount;

  saveGame();
 },

 addStar(amount){

  save.star+=amount;

  saveGame();
 },

 setLevel(level){

  save.level=
   Math.max(
    1,
    Math.min(
     2000,
     level
    )
   );

  saveGame();
 },

 reset(){

  localStorage.removeItem(
   "seasonDungeonSave"
  );

  location.reload();

 }

};
