<!DOCTYPE html>
<html lang="ko">
<head>

<meta name="viewport"

<title>Dungeon World</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#10151c;
    font-family:Arial,sans-serif;
    color:white;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

button{
    border:0;
    border-radius:9px;
    background:#344255;
    color:white;
    padding:9px 12px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#4c6078;
}

button:disabled{
    opacity:.4;
}

.ui{
    position:fixed;
    inset:0;
    pointer-events:none;
}

.panel{
    background:rgba(13,19,27,.9);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 6px 25px rgba(0,0,0,.35);
    border-radius:12px;
}

#stats{
    position:absolute;
    left:10px;
    top:10px;
    width:245px;
    padding:10px;
}

.bar{
    height:10px;
    background:#222;
    border-radius:10px;
    overflow:hidden;
    margin:4px 0 7px;
}

.bar > div{
    height:100%;
    transition:.15s;
}

#hpBar{
    background:#e84949;
}

#xpBar{
    background:#3d9cff;
}

#topButtons{
    position:absolute;
    right:10px;
    top:10px;
    display:flex;
    gap:6px;
    pointer-events:auto;
    flex-wrap:wrap;
    justify-content:flex-end;
    max-width:400px;
}

#weaponInfo{
    position:absolute;
    left:10px;
    bottom:10px;
    width:250px;
    padding:10px;
}

#mountInfo{
    position:absolute;
    right:10px;
    bottom:10px;
    width:170px;
    padding:10px;
}

#message{
    position:absolute;
    left:50%;
    top:105px;
    transform:translateX(-50%);
    padding:10px 18px;
    border-radius:30px;
    background:rgba(0,0,0,.72);
    opacity:0;
    transition:.2s;
    white-space:nowrap;
}

#message.show{
    opacity:1;
}

.modal{
    position:fixed;
    inset:0;
    z-index:20;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.7);
    pointer-events:auto;
}

.modal.show{
    display:flex;
}

.modalBox{
    width:min(850px,94vw);
    max-height:90vh;
    overflow:auto;
    background:#19222d;
    border:1px solid #4a5c70;
    border-radius:18px;
    padding:20px;
}

.modalBox h2{
    margin-top:0;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
    gap:10px;
}

.card{
    background:#263443;
    border:1px solid #405267;
    border-radius:12px;
    padding:12px;
}

.card h3{
    margin:0 0 8px;
    font-size:16px;
}

.card button{
    width:100%;
    margin-top:7px;
}

.locked{
    opacity:.45;
}

.tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    margin-bottom:15px;
}

.tab{
    white-space:nowrap;
}

.tab.active{
    background:#5d79a0;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

#touch{
    position:absolute;
    inset:0;
    pointer-events:none;
}

#joystick{
    position:absolute;
    left:25px;
    bottom:30px;
    width:125px;
    height:125px;
    border-radius:50%;
    background:rgba(255,255,255,.07);
    border:2px solid rgba(255,255,255,.2);
    pointer-events:auto;
}

#stick{
    position:absolute;
    width:54px;
    height:54px;
    left:33px;
    top:33px;
    border-radius:50%;
    background:rgba(255,255,255,.28);
}

#attack{
    position:absolute;
    right:25px;
    bottom:30px;
    width:105px;
    height:105px;
    border-radius:50%;
    background:#c93838;
    border:4px solid rgba(255,255,255,.3);
    font-size:18px;
    pointer-events:auto;
}

.choice{
    display:flex;
    gap:15px;
    justify-content:center;
}

.choice button{
    width:180px;
    height:150px;
    font-size:22px;
}

.small{
    font-size:12px;
    opacity:.7;
}

.good{
    color:#68ed83;
}

.gold{
    color:#ffd83d;
}

@media(max-width:700px){

    #stats{
        width:210px;
        font-size:12px;
    }

    #topButtons{
        max-width:180px;
    }

    #topButtons button{
        font-size:10px;
        padding:7px;
    }

    #weaponInfo{
        width:205px;
        bottom:165px;
        font-size:12px;
    }

    #mountInfo{
        display:none;
    }
}
</style>

function getEvent(){

    const now=new Date();

    const year=now.getFullYear();

    function weekContains(date){

        const d=new Date(date);

        const day=(d.getDay()+6)%7;

        const start=new Date(d);

        start.setDate(d.getDate()-day);

        const end=new Date(start);

        end.setDate(start.getDate()+6);

        return now>=start && now<=end;
    }

    if(weekContains(
        new Date(year,9,31)
    )){
        return "halloween";
    }

    if(weekContains(
        new Date(year,11,25)
    )){
        return "christmas";
    }

    return null;
}


/* =========================================================
   XP
========================================================= */

function neededXP(){

    if(player.level>=2000)
        return Infinity;

    return player.level*5;
}

function addXP(amount){

    while(
        amount>0 &&
        player.level<2000
    ){

        const needed=neededXP();
        const remaining=needed-player.xp;

        const add=Math.min(
            amount,
            remaining
        );

        player.xp+=add;
        amount-=add;

        if(player.xp>=needed){

            player.xp=0;

            player.level++;

            player.maxHp+=3;
            player.hp=player.maxHp;

            player.lp+=2;

            showMessage(
                "🎉 레벨 "+player.level+
                " 달성! LP +2"
            );
        }
    }
}


/* =========================================================
   지역
========================================================= */

function pointInEllipse(x,y,r){

    const dx=(x-r.cx)/r.rx;
    const dy=(y-r.cy)/r.ry;

    return dx*dx+dy*dy<=1;
}

function getRegion(x,y){

    /*
      특수 지역 우선 검사
    */

    for(const r of REGIONS){

        if(pointInEllipse(x,y,r))
            return r;
    }

    return REGIONS[0];
}


function canMove(x,y){

    const r=getRegion(x,y);

    if(r.water){

        if(!player.equipment.mount)
            return false;

        const mount=
            MOUNTS.find(
                m=>m.id===player.equipment.mount
            );

        if(!mount || mount.type!=="air")
            return false;
    }

    return true;
}

const joystick=
    document.getElementById("joystick");

const stick=
    document.getElementById("stick");

let joyActive=false;

joystick.addEventListener(
    "pointerdown",
    e=>{
        joyActive=true;
        joystick.setPointerCapture(e.pointerId);
        moveJoy(e);
    }
);

joystick.addEventListener(
    "pointermove",
    e=>{
        if(joyActive)
            moveJoy(e);
    }
);

joystick.addEventListener(
    "pointerup",
    ()=>{
        joyActive=false;
        joyX=0;
        joyY=0;

        stick.style.left="33px";
        stick.style.top="33px";
    }
);

function moveJoy(e){

    const r=joystick.getBoundingClientRect();

    let x=e.clientX-
        (r.left+r.width/2);

    let y=e.clientY-
        (r.top+r.height/2);

    const max=43;

    const len=Math.hypot(x,y);

    if(len>max){

        x=x/len*max;
        y=y/len*max;
    }

    joyX=x/max;
    joyY=y/max;

    /*
      모바일 조준 방향
    */

    aim.x=player.x+joyX*300;
    aim.y=player.y+joyY*300;
    aim.active=len>5;

    stick.style.left=(33+x)+"px";
    stick.style.top=(33+y)+"px";
}

/* =========================================================
   무기
========================================================= */

function currentWeapon(){

    return WEAPONS.find(
        w=>w.id===player.equipment.weapon
    ) || WEAPONS[0];
}


function weaponDamage(){

    const w=currentWeapon();

    return Math.floor(
        w.damage*
        (1+player.weaponUpgrade*.18)
    );
}


/* =========================================================
   120도 공격
========================================================= */

function attack(){

    if(player.attackTimer>0)
        return;

    const weapon=currentWeapon();

    player.attackTimer=weapon.cooldown;

    /*
      공격 애니메이션 시작
    */

    player.attackAnimation=.28;

    const dx=aim.x-player.x;
    const dy=aim.y-player.y;

    player.attackAngle=
        Math.atan2(dy,dx);

    /*
      원거리 무기는 투사체
    */

    if(weapon.projectile){

        fireProjectile();

        return;
    }

    /*
      근접무기:
      중심각 ±60°
      = 총 120°
    */

    for(const enemy of [...enemies]){

        const ex=enemy.x-player.x;
        const ey=enemy.y-player.y;

        const distance=Math.hypot(ex,ey);

        if(distance>weapon.range)
            continue;

        const enemyAngle=
            Math.atan2(ey,ex);

        let diff=
            normalizeAngle(
                enemyAngle-
                player.attackAngle
            );

        /*
          ±60도
        */

        if(Math.abs(diff)<=Math.PI/3){

            enemy.hp-=weaponDamage();

            enemy.flash=.12;

            burst(
                enemy.x,
                enemy.y,
                "#ffffff"
            );

            if(enemy.hp<=0)
                killEnemy(enemy);
        }
    }
}


function normalizeAngle(a){

    while(a>Math.PI)
        a-=Math.PI*2;

    while(a<-Math.PI)
        a+=Math.PI*2;

    return a;
}


/* =========================================================
   투사체
========================================================= */

function fireProjectile(){

    const weapon=currentWeapon();

    let dx=aim.x-player.x;
    let dy=aim.y-player.y;

    const len=Math.hypot(dx,dy)||1;

    dx/=len;
    dy/=len;

    projectiles.push({

        x:player.x,
        y:player.y,

        vx:dx*650,
        vy:dy*650,

        life:weapon.range/650,

        damage:weaponDamage(),

        type:weapon.id
    });
}


/* =========================================================
   몬스터
========================================================= */

function spawnEnemy(type,x,y){

    const base=MONSTERS[type];

    if(!base)
        return;

    enemies.push({

        type,

        x,
        y,

        homeX:x,
        homeY:y,

        hp:base.hp,
        maxHp:base.hp,

        attackTimer:0,
        flash:0
    });
}


function spawnRandomEnemy(){

    const r=getRegion(
        player.x+
        (Math.random()-.5)*1300,

        player.y+
        (Math.random()-.5)*1300
    );

    let list=[];

    switch(r.id){

        case "meadow":
            list=[
                "slime",
                "slime",
                "goblin"
            ];
            break;

        case "lake":
            list=[
                "slime",
                "royalSlime"
            ];
            break;

        case "jungle":
            list=[
                "oni",
                "goblin",
                "witch"
            ];
            break;

        case "volcano":
            list=[
                "volcanoDemon",
                "phoenix"
            ];
            break;

        case "hell":
            list=[
                "demonSoldier",
                "demonSergeant",
                "ultimateDemon"
            ];
            break;

        case "arctic":
            list=[
                "frostSlime",
                "frostDemon"
            ];
            break;

        case "ocean":
            list=[
                "phoenix"
            ];
            break;
    }

    if(!list.length)
        return;

    const type=
        list[
            Math.floor(
                Math.random()*list.length
            )
        ];

    let x;
    let y;

    for(let i=0;i<10;i++){

        x=r.cx+
            (Math.random()*2-1)*r.rx*.75;

        y=r.cy+
            (Math.random()*2-1)*r.ry*.75;

        if(canMove(x,y))
            break;
    }

    spawnEnemy(type,x,y);
}


/* =========================================================
   몬스터 AI
========================================================= */

function updateEnemy(enemy,dt){

    const base=MONSTERS[enemy.type];

    const dx=player.x-enemy.x;
    const dy=player.y-enemy.y;

    const distance=Math.hypot(dx,dy);

    /*
      감지 범위
    */

    if(distance<=base.detect){

        /*
          플레이어 추적
        */

        if(distance>40){

            enemy.x+=
                dx/distance*
                base.speed*
                dt;

            enemy.y+=
                dy/distance*
                base.speed*
                dt;
        }

        /*
          공격
        */

        if(distance<45){

            enemy.attackTimer-=dt;

            if(enemy.attackTimer<=0){

                enemy.attackTimer=1.2;

                player.hp-=base.damage;

                burst(
                    player.x,
                    player.y,
                    "#ff3333"
                );

                if(player.hp<=0){

                    player.hp=player.maxHp;

                    player.x=enemy.homeX;
                    player.y=enemy.homeY;

                    showMessage(
                        "💀 쓰러졌습니다!"
                    );
                }
            }
        }

    }else{

        /*
          플레이어가 멀어졌으면
          원래 위치로 복귀
        */

        const hx=
            enemy.homeX-enemy.x;

        const hy=
            enemy.homeY-enemy.y;

        const homeDistance=
            Math.hypot(hx,hy);

        if(homeDistance>6){

            enemy.x+=
                hx/homeDistance*
                base.speed*.65*
                dt;

            enemy.y+=
                hy/homeDistance*
                base.speed*.65*
                dt;
        }
    }

    if(enemy.flash>0)
        enemy.flash-=dt;
}


/* =========================================================
   처치
========================================================= */

function killEnemy(enemy){

    const base=MONSTERS[enemy.type];

    player.coins+=
        Math.floor(
            base.hp*.4+
            Math.random()*30
        );

    player.lp+=
        base.boss
        ?5
        :1;

    addXP(
        Math.max(
            5,
            Math.floor(base.hp/8)
        )
    );

    if(base.boss){

        player.stars+=2;

        showMessage(
            "👑 보스 처치! ⭐ +2"
        );
    }

    burst(
        enemy.x,
        enemy.y,
        base.color
    );

    enemies=
        enemies.filter(
            e=>e!==enemy
        );
}


/* =========================================================
   이동
========================================================= */

function updatePlayer(dt){

    let x=0;
    let y=0;

    if(keys["w"] || keys["arrowup"])
        y--;

    if(keys["s"] || keys["arrowdown"])
        y++;

    if(keys["a"] || keys["arrowleft"])
        x--;

    if(keys["d"] || keys["arrowright"])
        x++;

    x+=joyX;
    y+=joyY;

    const len=Math.hypot(x,y);

    if(len>0){

        x/=len;
        y/=len;

        let speed=180;

        if(player.equipment.mount){

            const m=MOUNTS.find(
                m=>m.id===player.equipment.mount
            );

            if(m)
                speed=m.speed;
        }

        const nx=player.x+x*speed*dt;
        const ny=player.y+y*speed*dt;

        if(canMove(nx,ny)){

            player.x=nx;
            player.y=ny;
        }
    }

    if(player.attackTimer>0)
        player.attackTimer-=dt;

    if(player.attackAnimation>0)
        player.attackAnimation-=dt;
}


/* =========================================================
   투사체 업데이트
========================================================= */

function updateProjectiles(dt){

    for(const p of projectiles){

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.life-=dt;

        for(const enemy of [...enemies]){

            if(
                Math.hypot(
                    enemy.x-p.x,
                    enemy.y-p.y
                )<28
            ){

                enemy.hp-=p.damage;

                enemy.flash=.1;

                burst(
                    enemy.x,
                    enemy.y,
                    "#ffe75b"
                );

                p.life=0;

                if(enemy.hp<=0)
                    killEnemy(enemy);

                break;
            }
        }
    }

    projectiles=
        projectiles.filter(
            p=>p.life>0
        );
}


/* =========================================================
   파티클
========================================================= */

function burst(x,y,color){

    for(let i=0;i<9;i++){

        particles.push({

            x,
            y,

            vx:(Math.random()-.5)*180,
            vy:(Math.random()-.5)*180,

            life:.5,

            color
        });
    }
}


function updateParticles(dt){

    for(const p of particles){

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.life-=dt;
    }

    particles=
        particles.filter(
            p=>p.life>0
        );
}


/* =========================================================
   렌더링
========================================================= */

function draw(){

    ctx.clearRect(0,0,W,H);

    camera.x=player.x-W/2;
    camera.y=player.y-H/2;

    ctx.save();

    ctx.translate(
        -camera.x,
        -camera.y
    );

    drawWorld();
    drawAim();
    drawProjectiles();
    drawEnemies();
    drawPlayer();
    drawParticles();

    ctx.restore();
}


/* =========================================================
   세계
========================================================= */

function drawWorld(){

    ctx.fillStyle="#20251f";

    ctx.fillRect(
        camera.x-2000,
        camera.y-2000,
        W+4000,
        H+4000
    );

    for(const r of REGIONS){

        ctx.save();

        ctx.beginPath();

        /*
          타원 + 굴곡을 섞어
          단순 직사각형 맵을 피함
        */

        const points=32;

        for(let i=0;i<=points;i++){

            const a=
                Math.PI*2*i/points;

            const wobble=
                1+
                Math.sin(a*5+r.cx)*.08+
                Math.cos(a*3+r.cy)*.05;

            const x=
                r.cx+
                Math.cos(a)*
                r.rx*wobble;

            const y=
                r.cy+
                Math.sin(a)*
                r.ry*wobble;

            if(i===0)
                ctx.moveTo(x,y);
            else
                ctx.lineTo(x,y);
        }

        ctx.closePath();

        ctx.fillStyle=r.color;
        ctx.fill();

        ctx.strokeStyle=
            "rgba(0,0,0,.3)";

        ctx.lineWidth=10;
        ctx.stroke();

        drawRegionDecor(r);

        ctx.restore();
    }

    drawPaths();
}


/* =========================================================
   지역 장식
========================================================= */

function drawRegionDecor(r){

    const amount=
        Math.floor(
            Math.min(
                r.rx,
                r.ry
            )/20
        );

    for(let i=0;i<amount;i++){

        const angle=
            i*2.399;

        const radius=
            .25+
            ((i*17)%70)/100;

        const x=
            r.cx+
            Math.cos(angle)*
            r.rx*
            radius;

        const y=
            r.cy+
            Math.sin(angle)*
            r.ry*
            radius;

        if(r.id==="meadow"){
            drawTree(
                x,
                y,
                "#26733a"
            );

            if(i%4===0)
                drawFlower(x+15,y+10);
        }

        if(r.id==="jungle"){

            drawTree(
                x,
                y,
                "#124728"
            );

            drawVine(x,y);
        }

        if(r.id==="arctic")
            drawIce(x,y);

        if(
            r.id==="volcano" ||
            r.id==="hell"
        ){
            drawRock(
                x,
                y,
                "#241717"
            );
        }

        if(r.water)
            drawWave(x,y);
    }

    if(r.id==="volcano"){

        for(let i=0;i<4;i++){

            drawVolcano(
                r.cx-r.rx*.55+i*180,
                r.cy-80
            );
        }
    }
}


function drawTree(x,y,color){

    ctx.fillStyle="#67442b";

    ctx.fillRect(
        x-5,
        y,
        10,
        25
    );

    ctx.fillStyle=color;

    ctx.beginPath();

    ctx.arc(
        x,
        y-10,
        26,
        0,
        Math.PI*2
    );

    ctx.fill();
}


function drawFlower(x,y){

    ctx.fillStyle="#ffd84a";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();
}


function drawVine(x,y){

    ctx.strokeStyle="#0b3c22";
    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(x,y-15);
    ctx.quadraticCurveTo(
        x+20,
        y+15,
        x+3,
        y+30
    );

    ctx.stroke();
}


function drawIce(x,y){

    ctx.fillStyle="#eaffff";

    ctx.beginPath();

    ctx.moveTo(x,y-25);
    ctx.lineTo(x+22,y+20);
    ctx.lineTo(x-22,y+20);

    ctx.closePath();

    ctx.fill();
}


function drawRock(x,y,color){

    ctx.fillStyle=color;

    ctx.beginPath();

    ctx.moveTo(
        x-20,
        y+12
    );

    ctx.lineTo(
        x-10,
        y-15
    );

    ctx.lineTo(
        x+15,
        y-20
    );

    ctx.lineTo(
        x+25,
        y+10
    );

    ctx.closePath();

    ctx.fill();
}


function drawWave(x,y){

    ctx.strokeStyle=
        "rgba(255,255,255,.18)";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        25,
        0,
        Math.PI
    );

    ctx.stroke();
}


function drawVolcano(x,y){

    ctx.fillStyle="#38211c";

    ctx.beginPath();

    ctx.moveTo(
        x-75,
        y+60
    );

    ctx.lineTo(
        x-25,
        y-60
    );

    ctx.lineTo(
        x+25,
        y-60
    );

    ctx.lineTo(
        x+75,
        y+60
    );

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle="#ff481b";

    ctx.beginPath();

    ctx.arc(
        x,
        y-50,
        17,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =========================================================
   길
========================================================= */

function drawPaths(){

    ctx.strokeStyle="#b89a62";
    ctx.lineWidth=42;
    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(-1000,500);

    ctx.quadraticCurveTo(
        -200,
        250,
        500,
        400
    );

    ctx.quadraticCurveTo(
        1000,
        550,
        1700,
        400
    );

    ctx.stroke();

    ctx.strokeStyle="#d1b77c";
    ctx.lineWidth=25;

    ctx.beginPath();

    ctx.moveTo(500,400);

    ctx.quadraticCurveTo(
        350,
        1000,
        350,
        1650
    );

    ctx.stroke();
}


/* =========================================================
   조준
========================================================= */

function drawAim(){

    if(!aim.active)
        return;

    const weapon=currentWeapon();

    const angle=
        Math.atan2(
            aim.y-player.y,
            aim.x-player.x
        );

    ctx.save();

    /*
      사거리
    */

    ctx.strokeStyle=
        "rgba(255,255,255,.25)";

    ctx.lineWidth=2;

    ctx.setLineDash([8,8]);

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        weapon.range,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.setLineDash([]);

    /*
      실제 120도 공격 범위
    */

    if(!weapon.projectile){

        ctx.fillStyle=
            "rgba(255,220,70,.08)";

        ctx.beginPath();

        ctx.moveTo(
            player.x,
            player.y
        );

        ctx.arc(
            player.x,
            player.y,
            weapon.range,
            angle-Math.PI/3,
            angle+Math.PI/3
        );

        ctx.closePath();

        ctx.fill();

        ctx.strokeStyle=
            "rgba(255,220,70,.45)";

        ctx.beginPath();

        ctx.moveTo(
            player.x,
            player.y
        );

        ctx.arc(
            player.x,
            player.y,
            weapon.range,
            angle-Math.PI/3,
            angle+Math.PI/3
        );

        ctx.closePath();

        ctx.stroke();
    }

    ctx.restore();
}

        );

    drawWeapon();

            player.hp/player.maxHp
        ),
        6
    );
}

/* =========================================================
   무기 렌더링
========================================================= */

function drawWeapon(){

    const weapon=currentWeapon();

    let angle=
        Math.atan2(
            aim.y-player.y,
            aim.x-player.x
        );

    /*
      공격 애니메이션:
      -60 → +60
    */

    if(player.attackAnimation>0){

        const progress=
            1-
            player.attackAnimation/.28;

        angle=
            player.attackAngle-
            Math.PI/3+
            progress*
            Math.PI*2/3;
    }

    ctx.save();

    ctx.translate(
        player.x,
        player.y
    );

    ctx.rotate(angle);

    let skin=
        player.equipment.weaponSkin;

    /*
      캔디 지팡이
    */

    if(
        weapon.id==="pipe" &&
        skin==="candy"
    ){

        ctx.strokeStyle="#fff";
        ctx.lineWidth=8;

        ctx.beginPath();

        ctx.moveTo(8,0);
        ctx.lineTo(48,0);

        ctx.stroke();

        ctx.strokeStyle="#ef4444";
        ctx.lineWidth=4;

        ctx.beginPath();

        ctx.moveTo(25,-4);
        ctx.lineTo(40,4);

        ctx.stroke();

        return ctx.restore();
    }

    /*
      양말 발사기
    */

    if(
        weapon.id==="rocket" &&
        skin==="sock"
    ){

        ctx.fillStyle="#e73636";

        ctx.fillRect(
            10,
            -7,
            42,
            14
        );

        ctx.fillStyle="#fff";

        ctx.fillRect(
            43,
            -7,
            9,
            14
        );

        return ctx.restore();
    }

    /*
      기본 무기
    */

    ctx.lineCap="round";

    if(weapon.id==="stick"){

        ctx.strokeStyle="#754526";
        ctx.lineWidth=8;

        ctx.beginPath();

        ctx.moveTo(8,0);
        ctx.lineTo(52,0);

        ctx.stroke();
    }

    else if(weapon.id==="stone"){

        ctx.fillStyle="#777";

        ctx.beginPath();

        ctx.arc(
            38,
            0,
            10,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    else if(weapon.id==="axe"){

        ctx.strokeStyle="#704323";
        ctx.lineWidth=6;

        ctx.beginPath();

        ctx.moveTo(8,0);
        ctx.lineTo(45,0);

        ctx.stroke();

        ctx.fillStyle="#aaa";

        ctx.fillRect(
            35,
            -14,
            18,
            28
        );
    }

    else if(weapon.id==="rocket"){

        ctx.fillStyle="#555";

        ctx.fillRect(
            10,
            -7,
            45,
            14
        );

        ctx.fillStyle="#ff5522";

        ctx.fillRect(
            10,
            -4,
            8,
            8
        );
    }

    else if(weapon.id==="zeus"){

        ctx.strokeStyle="#ffe34d";
        ctx.lineWidth=7;

        ctx.beginPath();

        ctx.moveTo(8,0);
        ctx.lineTo(25,-10);
        ctx.lineTo(35,5);
        ctx.lineTo(52,-5);

        ctx.stroke();
    }

    else{

        ctx.strokeStyle=
            weapon.id==="pen"
            ?"#161616"
            :"#ddd";

        ctx.lineWidth=7;

        ctx.beginPath();

        ctx.moveTo(8,0);
        ctx.lineTo(
            Math.min(
                65,
                weapon.range*.28
            ),
            0
        );

        ctx.stroke();

        if(weapon.id==="pen"){

            ctx.fillStyle="#267cff";

            ctx.beginPath();

            ctx.arc(
                60,
                0,
                4,
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    }

    ctx.restore();
}


/* =========================================================
   탈것 렌더링
========================================================= */

function drawMount(){

    const mount=player.equipment.mount;

    if(!mount)
        return;

    const skin=player.equipment.mountSkin;

    if(mount==="bike"){

        ctx.strokeStyle="#222";
        ctx.lineWidth=5;

        ctx.beginPath();

        ctx.arc(
            player.x-20,
            player.y+15,
            13,
            0,
            Math.PI*2
        );

        ctx.arc(
            player.x+20,
            player.y+15,
            13,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.strokeStyle="#e43b3b";

        ctx.beginPath();

        ctx.moveTo(
            player.x-20,
            player.y+15
        );

        ctx.lineTo(
            player.x,
            player.y-5
        );

        ctx.lineTo(
            player.x+20,
            player.y+15
        );

        ctx.lineTo(
            player.x-5,
            player.y+15
        );

        ctx.stroke();

        return;
    }

    if(mount==="car"){

        if(skin==="santaSleigh"){

            ctx.fillStyle="#d93434";

            ctx.fillRect(
                player.x-38,
                player.y-13,
                76,
                27
            );

            ctx.strokeStyle="#ffd34b";
            ctx.lineWidth=5;

            ctx.beginPath();

            ctx.arc(
                player.x,
                player.y+15,
                35,
                0,
                Math.PI
            );

            ctx.stroke();

            ctx.fillStyle="#fff";

            ctx.fillRect(
                player.x-35,
                player.y-17,
                70,
                5
            );

            return;
        }

        ctx.fillStyle="#d13b3b";

        ctx.fillRect(
            player.x-35,
            player.y-12,
            70,
            26
        );

        ctx.fillStyle="#9ddfff";

        ctx.fillRect(
            player.x-20,
            player.y-26,
            40,
            15
        );

        return;
    }

    if(mount==="plane"){

        ctx.fillStyle="#ddd";

        ctx.beginPath();

        ctx.moveTo(
            player.x+45,
            player.y
        );

        ctx.lineTo(
            player.x-30,
            player.y-18
        );

        ctx.lineTo(
            player.x-10,
            player.y
        );

        ctx.lineTo(
            player.x-30,
            player.y+18
        );

        ctx.closePath();

        ctx.fill();

        return;
    }

    if(mount==="fighter"){

        ctx.fillStyle="#555";

        ctx.beginPath();

        ctx.moveTo(
            player.x+50,
            player.y
        );

        ctx.lineTo(
            player.x-35,
            player.y-12
        );

        ctx.lineTo(
            player.x-15,
            player.y
        );

        ctx.lineTo(
            player.x-35,
            player.y+12
        );

        ctx.closePath();

        ctx.fill();

        return;
    }
}


/* =========================================================
   몬스터 렌더링
========================================================= */

function drawEnemies(){

    for(const enemy of enemies){

        const base=MONSTERS[enemy.type];

        ctx.save();

        ctx.translate(
            enemy.x,
            enemy.y
        );

        if(enemy.flash>0)
            ctx.globalAlpha=.45;

        /*
          슬라임
        */

        if(
            enemy.type==="slime" ||
            enemy.type==="royalSlime" ||
            enemy.type==="frostSlime"
        ){

            ctx.fillStyle=base.color;

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                base.size,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.fillStyle="#111";

            ctx.beginPath();

            ctx.arc(
                -6,
                -4,
                3,
                0,
                Math.PI*2
            );

            ctx.arc(
                6,
                -4,
                3,
                0,
                Math.PI*2
            );

            ctx.fill();
        }

        /*
          피닉스
        */

        else if(
            enemy.type==="phoenix"
        ){

            ctx.fillStyle=base.color;

            ctx.beginPath();

            ctx.moveTo(
                0,
                -base.size
            );

            ctx.lineTo(
                base.size,
                base.size
            );

            ctx.lineTo(
                0,
                base.size/2
            );

            ctx.lineTo(
                -base.size,
                base.size
            );

            ctx.closePath();

            ctx.fill();
        }

        /*
          나머지 몬스터
        */

        else{

            ctx.fillStyle=base.color;

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                base.size,
                0,
                Math.PI*2
            );

            ctx.fill();

            /*
              뿔
            */

            if(
                enemy.type==="oni" ||
                enemy.type.includes("Demon") ||
                enemy.type.includes("demon")
            ){

                ctx.fillStyle="#222";

                ctx.beginPath();

                ctx.moveTo(
                    -12,
                    -base.size+5
                );

                ctx.lineTo(
                    -5,
                    -base.size-12
                );

                ctx.lineTo(
                    0,
                    -base.size+5
                );

                ctx.moveTo(
                    12,
                    -base.size+5
                );

                ctx.lineTo(
                    5,
                    -base.size-12
                );

                ctx.lineTo(
                    0,
                    -base.size+5
                );

                ctx.fill();
            }
        }

        /*
          보스 링
        */

        if(base.boss){

            ctx.strokeStyle="#ffd83d";
            ctx.lineWidth=3;

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                base.size+9,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }

        ctx.restore();

        /*
          HP bar
        */

        ctx.fillStyle="#000";

        ctx.fillRect(
            enemy.x-base.size,
            enemy.y-base.size-12,
            base.size*2,
            5
        );

        ctx.fillStyle=
            base.boss
            ?"#ffd43d"
            :"#ef4444";

        ctx.fillRect(
            enemy.x-base.size,
            enemy.y-base.size-12,
            base.size*2*
            Math.max(
                0,
                enemy.hp/enemy.maxHp
            ),
            5
        );

        if(base.boss){

            ctx.font="bold 12px Arial";
            ctx.textAlign="center";
            ctx.fillStyle="#fff";

            ctx.fillText(
                "👑 "+base.name,
                enemy.x,
                enemy.y-base.size-18
            );
        }
    }
}

/* =========================================================
   파티클
========================================================= */

function drawParticles(){

    for(const p of particles){

        ctx.globalAlpha=
            Math.max(
                0,
                p.life*2
            );

        ctx.fillStyle=p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            3,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.globalAlpha=1;
}

                `<button
                    onclick="buyWeapon('${w.id}')">
                    🪙 ${w.price} 구매
                </button>`
                :
                `<button disabled>
                    🔒 이전 무기 필요
                </button>`
            }

        `;

        box.appendChild(card);
    });
}


function buyWeapon(id){

    const weapon=
        WEAPONS.find(
            w=>w.id===id
        );

    if(
        player.inventory.weapons
        .includes(id)
    ){

        showMessage(
            "이미 보유한 무기입니다."
        );

        return;
    }

    const index=
        WEAPONS.findIndex(
            w=>w.id===id
        );

    if(index>0){

        const previous=
            WEAPONS[index-1].id;

        if(
            !player.inventory.weapons
            .includes(previous)
        ){

            showMessage(
                "이전 무기를 먼저 구매하세요."
            );

            return;
        }
    }

    if(player.coins<weapon.price){

        showMessage(
            "코인이 부족합니다."
        );

        return;
    }

    player.coins-=weapon.price;

    player.inventory.weapons.push(id);

    showMessage(
        "🔓 "+weapon.name+
        " 구매 완료!"
    );

    renderShop();
    updateUI();
}

let dailyItems=[];

function generateDailyShop(){

    const event=getEvent();

    const available=
        DAILY_POOL.filter(item=>{

            if(!item.event)
                return true;

            return item.event===event;
        });

    dailyItems=[];

    while(
        dailyItems.length<5 &&
        available.length
    ){

        const item=
            available[
                Math.floor(
                    Math.random()*
                    available.length
                )
            ];

        if(
            !dailyItems
            .some(x=>x.id===item.id)
        ){

            dailyItems.push(item);
        }
    }

    /*
      항상 5개가 되도록
      일반 상품으로 채움
    */

    while(
        dailyItems.length<5
    ){

        const normal=
            DAILY_POOL.filter(
                x=>!x.event
            );

        const item=
            normal[
                Math.floor(
                    Math.random()*
                    normal.length
                )
            ];

        if(
            !dailyItems
            .some(x=>x.id===item.id)
        ){

            dailyItems.push(item);
        }
    }
}


function openDailyShop(){

    generateDailyShop();

    const box=
        document.getElementById(
            "dailyItems"
        );

    box.innerHTML="";

    dailyItems.forEach(
        (item,index)=>{

            const card=
                document.createElement("div");

            card.className="card";

            card.innerHTML=`

                <h3>
                    ${item.name}
                </h3>

                ${
                    item.event
                    ?
                    `<div class="gold">
                        ⭐ 기간 한정
                    </div>`
                    :
                    `<div class="small">
                        기본 상품
                    </div>`
                }

                <div>
                    ⭐ ${item.price}
                </div>

                <button
                    onclick="buyDaily(${index})">
                    구매
                </button>

            `;

            box.appendChild(card);
        }
    );

    document
        .getElementById("dailyModal")
        .classList.add("show");
}


function buyDaily(index){

    const item=dailyItems[index];

    if(!item)
        return;

    if(player.stars<item.price){

        showMessage(
            "⭐ 스타가 부족합니다."
        );

        return;
    }

    player.stars-=item.price;

    if(item.type==="weaponSkin"){

        if(
            !player.inventory.weaponSkins
            .includes(item.skin)
        ){

            player.inventory.weaponSkins
                .push(item.skin);
        }
    }

    if(item.type==="mountSkin"){

        if(
            !player.inventory.mountSkins
            .includes(item.skin)
        ){

            player.inventory.mountSkins
                .push(item.skin);
        }
    }

    if(item.type==="character"){

        if(
            !player.inventory.characterItems
            .includes(item.id)
        ){

            player.inventory.characterItems
                .push(item.id);
        }
    }

    showMessage(
        "⭐ "+item.name+
        " 획득!"
    );

    openDailyShop();

    updateUI();
}


/* =========================================================
   무기 강화
========================================================= */

function upgradeWeapon(){

    const cost=
        100+
        player.weaponUpgrade*
        100;

    if(player.coins<cost){

        showMessage(
            "🪙 코인이 부족합니다."
        );

        return;
    }

    player.coins-=cost;

    player.weaponUpgrade++;

    showMessage(
        "⚔ 무기 강화 +"+
        player.weaponUpgrade
    );

    updateUI();
}


/* =========================================================
   UI
========================================================= */

function updateUI(){

    const weapon=currentWeapon();

    document.getElementById("gender")
        .textContent=
        player.gender==="boy"
        ?"남자아이"
        :
        player.gender==="girl"
        ?"여자아이"
        :
        "캐릭터";

    document.getElementById("level")
        .textContent=player.level;

    document.getElementById("xpText")
        .textContent=
        player.level>=2000
        ?"MAX"
        :
        `${Math.floor(player.xp)} / ${neededXP()}`;

    document.getElementById("xpBar")
        .style.width=
        player.level>=2000
        ?"100%"
        :
        Math.min(
            100,
            player.xp/
            neededXP()*
            100
        )+"%";

    document.getElementById("hpText")
        .textContent=
        `${Math.max(
            0,
            Math.floor(player.hp)
        )} / ${player.maxHp}`;

    document.getElementById("hpBar")
        .style.width=
        Math.max(
            0,
            player.hp/player.maxHp*100
        )+"%";

    document.getElementById("coins")
        .textContent=player.coins;

    document.getElementById("lp")
        .textContent=player.lp;

    document.getElementById("stars")
        .textContent=player.stars;

    document.getElementById("region")
        .textContent=
        getRegion(
            player.x,
            player.y
        ).name;

    document.getElementById("weaponName")
        .textContent=
        weapon.name+
        " +"+player.weaponUpgrade;

    document.getElementById("weaponStats")
        .innerHTML=
        `
        공격력: ${weaponDamage()}<br>
        사거리: ${weapon.range}<br>
        공격각: ${weapon.projectile?"원거리":"120° 부채꼴"}
        `;

    const mount=
        player.equipment.mount
        ?
        MOUNTS.find(
            m=>m.id===player.equipment.mount
        )
        :
        null;

    document.getElementById("mountName")
        .textContent=
        mount
        ?
        mount.name+
        (
            player.equipment.mountSkin
            ?" / 🎨 스킨"
            :""
        )
        :
        "없음";
}


/* =========================================================
   저장
========================================================= */

function saveGame(){

    localStorage.setItem(
        "DungeonWorldSave",
        JSON.stringify(player)
    );

    showMessage(
        "💾 저장 완료!"
    );
}


function loadGame(){

    const saved=
        localStorage.getItem(
            "DungeonWorldSave"
        );

    if(!saved)
        return;

    try{

        const data=JSON.parse(saved);

        Object.assign(
            player,
            data
        );

        /*
          이전 버전 세이브 호환
        */

        if(!player.inventory)
            player.inventory={
                weapons:["stick"],
                weaponSkins:[],
                mounts:[],
                mountSkins:[],
                characterItems:[]
            };

        if(!player.equipment)
            player.equipment={
                weapon:"stick",
                weaponSkin:null,
                mount:null,
                mountSkin:null,
                hair:"none",
                hat:"none",
                clothes:"blue",
                accessory:"none"
            };

    }catch(e){

        console.error(
            "세이브 불러오기 실패",
            e
        );
    }
}

   모달
========================================================= */

        .getElementById(id)
        .classList.remove("show");
}


/* =========================================================
   성별
========================================================= */

function selectGender(g){

    player.gender=g;

    closeModal("genderModal");

}


/* =========================================================
   메시지
========================================================= */

function showMessage(text){

    const el=
        document.getElementById(
            "message"
        );

    el.textContent=text;

    el.classList.add("show");

    messageTimer=2;
}


/* =========================================================
   게임 루프
========================================================= */

let lastTime=performance.now();

function loop(now){

    const dt=
        Math.min(
            .033,
            (now-lastTime)/1000
        );

    lastTime=now;

    updatePlayer(dt);

    enemies.forEach(
        e=>updateEnemy(e,dt)
    );

    updateProjectiles(dt);

    updateParticles(dt);

    /*
      적 생성
    */

    if(
        enemies.length<20 &&
        Math.random()<dt*.75
    ){

        spawnRandomEnemy();
    }

    /*
      너무 멀어진 몬스터 제거
    */

    enemies=
        enemies.filter(e=>{

            return Math.hypot(
                e.x-player.x,
                e.y-player.y
            )<2800;
        });

    if(messageTimer>0){

        messageTimer-=dt;

        if(messageTimer<=0){

            document
                .getElementById(
                    "message"
                )
                .classList.remove(
                    "show"
                );
        }
    }

    draw();

    updateUI();

    requestAnimationFrame(loop);
}


/* =========================================================
   초기화
========================================================= */

loadGame();

if(!player.gender){

    document
        .getElementById(
            "genderModal"
        )
        .classList.add("show");
}

updateUI();

requestAnimationFrame(loop);


/* =========================================================
   자동 저장
========================================================= */

setInterval(
    saveGame,
    30000
);

</script>
