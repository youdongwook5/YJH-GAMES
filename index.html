<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fantasy Dungeon Roguelike</title>

<style>
*{
    box-sizing:border-box;
    -webkit-user-select:none;
    user-select:none;
    touch-action:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
    color:white;
}

#game{
    position:fixed;
    inset:0;
    background:#172018;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
}

.panel{
    background:rgba(10,15,20,.86);
    border:1px solid rgba(255,255,255,.18);
    border-radius:12px;
    box-shadow:0 5px 25px rgba(0,0,0,.4);
}

#stats{
    position:absolute;
    top:10px;
    left:10px;
    width:245px;
    padding:10px;
}

#stats b{
    color:#ffd84d;
}

.bar{
    height:12px;
    background:#252525;
    border-radius:8px;
    overflow:hidden;
    margin:4px 0;
}

.bar div{
    height:100%;
}

#hpFill{background:#e83d4f;width:100%}
#xpFill{background:#35a8ff;width:0%}

#buttons{
    position:absolute;
    top:10px;
    right:10px;
    display:flex;
    gap:7px;
    pointer-events:auto;
}

button{
    border:0;
    color:white;
    background:#303b4a;
    border-radius:9px;
    padding:9px 12px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#46576c;
}

#message{
    position:absolute;
    top:100px;
    left:50%;
    transform:translateX(-50%);
    padding:10px 18px;
    background:rgba(0,0,0,.65);
    border-radius:20px;
    opacity:0;
    transition:.25s;
}

#message.show{
    opacity:1;
}

#mountPanel{
    position:absolute;
    right:10px;
    bottom:10px;
    width:160px;
    padding:8px;
    pointer-events:auto;
}

.mountBtn{
    display:block;
    width:100%;
    margin:4px 0;
}

#weaponPanel{
    position:absolute;
    left:10px;
    bottom:10px;
    width:245px;
    padding:8px;
}

#touchControls{
    position:absolute;
    inset:0;
    pointer-events:none;
}

#joystick{
    position:absolute;
    left:25px;
    bottom:30px;
    width:125px;
    height:125px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    border:2px solid rgba(255,255,255,.2);
    pointer-events:auto;
}

#stick{
    position:absolute;
    width:55px;
    height:55px;
    left:33px;
    top:33px;
    border-radius:50%;
    background:rgba(255,255,255,.28);
}

#attackBtn{
    position:absolute;
    right:30px;
    bottom:35px;
    width:100px;
    height:100px;
    border-radius:50%;
    background:#d64040;
    border:4px solid rgba(255,255,255,.3);
    font-size:20px;
    pointer-events:auto;
}

.modal{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.7);
    z-index:20;
    pointer-events:auto;
}

.modal.show{
    display:flex;
}

.modalBox{
    width:min(720px,94vw);
    max-height:90vh;
    overflow:auto;
    padding:20px;
    background:#18202b;
    border-radius:18px;
    border:1px solid #536273;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:10px;
}

.card{
    background:#263241;
    padding:12px;
    border-radius:12px;
    border:1px solid #3c4c5e;
}

.card button{
    width:100%;
    margin-top:7px;
}

.small{
    font-size:12px;
    opacity:.75;
}

#genderChoice{
    display:flex;
    gap:15px;
    justify-content:center;
}

.gender{
    width:180px;
    padding:25px;
    font-size:20px;
}

@media(max-width:700px){
    #stats{
        width:205px;
        font-size:12px;
    }

    #weaponPanel{
        bottom:165px;
        width:200px;
        font-size:12px;
    }

    #mountPanel{
        display:none;
    }

    #buttons button{
        padding:7px;
        font-size:11px;
    }
}
</style>
</head>

    </div>

    <div id="touchControls">

<!-- 성별 선택 -->
<div id="genderModal" class="modal">

        <p>플레이할 캐릭터를 선택하세요.</p>

            <button class="gender" onclick="chooseGender('boy')">

                👧<br>여자아이

        </div>
    </div>
</div>


<!-- 상점 -->
<div id="shopModal" class="modal">
    <div class="modalBox">
        <h2>🛒 기본 상점</h2>
        <p>코인으로 다음 무기와 무기 강화를 구매할 수 있습니다.</p>

<!-- 일일상점 -->

/* =========================================================
   저장 / 불러오기
========================================================= */

function saveGame(){

    localStorage.setItem(
        "fantasyDungeonSave",
        JSON.stringify({
            player
        })
    );

    showMessage("게임이 저장되었습니다.");
}


function loadGame(){

    const data = localStorage.getItem("fantasyDungeonSave");

    if(!data) return;

    try{
        const obj = JSON.parse(data);

        Object.assign(player,obj.player);

        if(player.gender){
            document.getElementById("genderModal")
                .classList.remove("show");
        }

    }catch(e){
        console.log(e);
    }
}

});

});


/* =========================================================
   마우스 조준
========================================================= */

canvas.addEventListener("mousemove",e=>{

    const rect = canvas.getBoundingClientRect();

    const sx = e.clientX;
    const sy = e.clientY;

    const wx = sx + camera.x;
    const wy = sy + camera.y;

    aim.x = wx;
    aim.y = wy;
    aim.active = true;
});


canvas.addEventListener("mousedown",e=>{

    const rect = canvas.getBoundingClientRect();

    aim.x = e.clientX + camera.x;
    aim.y = e.clientY + camera.y;

    aim.active = true;

    attack();
});


canvas.addEventListener("mouseleave",()=>{
    aim.active=false;
});


/* =========================================================
   모바일 조이스틱
========================================================= */

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let joystickActive=false;
let joyX=0;
let joyY=0;

joystick.addEventListener("pointerdown",e=>{
    joystickActive=true;
    joystick.setPointerCapture(e.pointerId);
    moveJoystick(e);
});

joystick.addEventListener("pointermove",e=>{
    if(joystickActive) moveJoystick(e);
});

joystick.addEventListener("pointerup",()=>{
    joystickActive=false;
    joyX=0;
    joyY=0;

    stick.style.left="33px";
    stick.style.top="33px";
});

function moveJoystick(e){

    const r=joystick.getBoundingClientRect();

    let x=e.clientX-(r.left+r.width/2);
    let y=e.clientY-(r.top+r.height/2);

    const max=43;

    const len=Math.hypot(x,y);

    if(len>max){
        x=x/len*max;
        y=y/len*max;
    }

    joyX=x/max;
    joyY=y/max;

    stick.style.left=(33+x)+"px";
    stick.style.top=(33+y)+"px";

    aim.x=player.x+joyX*300;
    aim.y=player.y+joyY*300;
    aim.active=len>5;
}

/* =========================================================
   지역 계산
========================================================= */

function getRegion(x,y){

    /*
       불규칙한 지형 느낌을 만들기 위해
       가장 가까운 지역을 검사한다.
    */

    for(const r of regions){

        if(
            x>=r.x &&
            x<=r.x+r.w &&
            y>=r.y &&
            y<=r.y+r.h
        ){
            return r;
        }
    }

    return regions[0];
}


/* =========================================================
   물 / 이동 가능 여부
========================================================= */

function canMoveTo(x,y){

    const r=getRegion(x,y);

    if(r.water){

        /*
          비행기 / 전투기만 바다와 호수를 통과.
          탈것이 없거나 육상 탈것이면 이동 불가.
        */

        if(
            !player.mount ||
            mounts[player.mount].type!=="air"
        ){
            return false;
        }
    }

    return true;
}


/* =========================================================
   몬스터 생성
========================================================= */

function spawnEnemy(type,x,y){

    const base=monsters[type];

    if(!base) return;

    enemies.push({
        type,

        x,
        y,

        homeX:x,
        homeY:y,

        hp:base.hp,
        maxHp:base.hp,

        attackTimer:0,

        hitFlash:0
    });
}


function randomSpawn(){

    const r=getRegion(
        player.x+(Math.random()-.5)*1200,
        player.y+(Math.random()-.5)*1200
    );

    if(!r) return;

    let list=[];

    switch(r.name){

        case "초원":
            list=["slime","slime","goblin"];
            break;

        case "호수":
            list=["slime","royalSlime"];
            break;

        case "정글":
            list=["oni","jungleGoblin","witch"];
            break;

        case "화산":
        case "火山":
            list=["volcanoDemon","phoenix"];
            break;

        case "지옥":
            list=[
                "demonSoldier",
                "demonSergeant",
                "ultimateDemon"
            ];
            break;

    ];

/* =========================================================
   무기 공격
========================================================= */

function getWeapon(){

    return weapons[player.weapon];
}


function getDamage(){

    const w=getWeapon();

    return w.damage*(1+player.weaponUpgrade*.18);
}


function attack(){

    if(player.attackCooldown>0) return;

    const w=getWeapon();

    player.attackCooldown=1/(w.speed/500);

    let dx=aim.x-player.x;
    let dy=aim.y-player.y;

    let len=Math.hypot(dx,dy);

    if(len<1){
        dx=1;
        dy=0;
        len=1;
    }

    dx/=len;
    dy/=len;

    if(w.type==="melee"){

        meleeAttack(dx,dy);

    }else{

        projectileAttack(dx,dy);
    }
}


function meleeAttack(dx,dy){

    const w=getWeapon();
    const range=w.range;

    for(const e of enemies){

        const ex=e.x-player.x;
        const ey=e.y-player.y;

        const dist=Math.hypot(ex,ey);

        if(dist>range) continue;

        const dot=(ex*dx+ey*dy)/(dist||1);

        if(dot>.35){

            e.hp-=getDamage();

            e.hitFlash=.12;

            burst(e.x,e.y,"#fff");

            if(e.hp<=0){
                killEnemy(e);
            }
        }
    }
}


function projectileAttack(dx,dy){

    const w=getWeapon();

    projectiles.push({
        x:player.x,
        y:player.y,

        vx:dx*w.speed,
        vy:dy*w.speed,

        life:w.range/w.speed,

        damage:getDamage(),

        type:w.type
    });
}


/* =========================================================
   몬스터 처치
========================================================= */

function killEnemy(e){

    const base=monsters[e.type];

    player.coins+=Math.floor(
        base.hp*.35+Math.random()*20
    );

    player.lp+=base.boss?5:1;

    if(base.boss){
        player.stars+=2;

        showMessage(
            "👑 보스 처치! ⭐ 스타 +2"
        );
    }

    addXP(
        Math.max(
            5,
            Math.floor(base.hp/8)
        )
    );

    burst(e.x,e.y,base.color);

    enemies=enemies.filter(x=>x!==e);
}


/* =========================================================
   XP / 레벨
========================================================= */

function xpNeeded(){

    if(player.level>=2000)
        return Infinity;

    return player.level*5;
}


function addXP(amount){

    if(player.level>=2000) return;

    player.xp+=amount;

    while(
        player.level<2000 &&
        player.xp>=xpNeeded()
    ){

        player.xp-=xpNeeded();

        player.level++;

        player.maxHp+=3;
        player.hp=player.maxHp;

        player.lp+=2;

        showMessage(
            `🎉 레벨 ${player.level}! LP +2`
        );
    }
}


function levelUp(){

    if(player.level>=2000) return;

    if(player.lp<=0){
        showMessage("LP가 부족합니다.");
        return;
    }

    player.lp--;

    player.level++;

    player.maxHp+=3;
    player.hp=player.maxHp;

    updateUI();
}

/* =========================================================
   이벤트
========================================================= */

function isHalloweenWeek(){

    const now=new Date();

    /*
      할로윈이 있는 주:
      10월 25~31일을 포함하는 주를
      월요일 기준으로 판단.
    */

    const year=now.getFullYear();

    const halloween=new Date(year,9,31);

    const start=new Date(halloween);

    const day=start.getDay();

    const mondayOffset=(day+6)%7;

    start.setDate(start.getDate()-mondayOffset);

    const end=new Date(start);

    end.setDate(end.getDate()+6);

    return now>=start && now<=end;
}


function isChristmasWeek(){

    const now=new Date();

    const year=now.getFullYear();

    const christmas=new Date(year,11,25);

    const start=new Date(christmas);

    const day=start.getDay();

    const mondayOffset=(day+6)%7;

    start.setDate(
        start.getDate()-mondayOffset
    );

    const end=new Date(start);

    end.setDate(end.getDate()+6);

    return now>=start && now<=end;
}


function getEvent(){

    if(isHalloweenWeek())
        return "halloween";

    if(isChristmasWeek())
        return "christmas";

    return null;
}


/* =========================================================
   몬스터 AI
========================================================= */

function updateEnemy(e,dt){

    const base=monsters[e.type];

    const dx=player.x-e.x;
    const dy=player.y-e.y;

    const dist=Math.hypot(dx,dy);

    /*
      감지 범위 안에 들어오면 추적
    */

    if(dist<=base.detect){

        if(dist>35){

            e.x += dx/dist*base.speed*dt;
            e.y += dy/dist*base.speed*dt;
        }

        if(dist<45){

            e.attackTimer-=dt;

            if(e.attackTimer<=0){

                e.attackTimer=1.2;

                player.hp-=base.damage;

                burst(
                    player.x,
                    player.y,
                    "#ff3344"
                );

                if(player.hp<=0){

                    player.hp=player.maxHp;

                    player.x=e.homeX;
                    player.y=e.homeY;

                    showMessage(
                        "💀 쓰러졌습니다! 원래 위치로 돌아갑니다."
                    );
                }
            }
        }

    }else{

        /*
          플레이어가 멀어졌으면 원래 위치로 복귀
        */

        const hx=e.homeX-e.x;
        const hy=e.homeY-e.y;

        const homeDist=Math.hypot(hx,hy);

        if(homeDist>5){

            e.x += hx/homeDist*base.speed*.7*dt;
            e.y += hy/homeDist*base.speed*.7*dt;

        }
    }

    if(e.hitFlash>0)
        e.hitFlash-=dt;
}


/* =========================================================
   투사체
========================================================= */

function updateProjectiles(dt){

    for(const p of projectiles){

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.life-=dt;

        for(const e of enemies){

            const d=Math.hypot(
                e.x-p.x,
                e.y-p.y
            );

            if(d<25){

                e.hp-=p.damage;

                e.hitFlash=.1;

                burst(
                    e.x,
                    e.y,
                    "#ffff88"
                );

                p.life=0;

                if(e.hp<=0)
                    killEnemy(e);

                break;
            }
        }
    }

    projectiles=
        projectiles.filter(p=>p.life>0);
}


/* =========================================================
   파티클
========================================================= */

function burst(x,y,color){

    for(let i=0;i<8;i++){

        particles.push({
            x,
            y,

            vx:(Math.random()-.5)*180,
            vy:(Math.random()-.5)*180,

            life:.5,

            color
        });
    }
}


function updateParticles(dt){

    for(const p of particles){

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.life-=dt;
    }

    particles=
        particles.filter(p=>p.life>0);
}


/* =========================================================
   플레이어 이동
========================================================= */

function updatePlayer(dt){

    let dx=0;
    let dy=0;

    if(keys["w"] || keys["arrowup"])
        dy--;

    if(keys["s"] || keys["arrowdown"])
        dy++;

    if(keys["a"] || keys["arrowleft"])
        dx--;

    if(keys["d"] || keys["arrowright"])
        dx++;

    dx+=joyX;
    dy+=joyY;

    const len=Math.hypot(dx,dy);

    if(len>0){

        dx/=len;
        dy/=len;

        let speed=player.speed;

        if(player.mount){
            speed=mounts[player.mount].speed;
        }

        const nx=player.x+dx*speed*dt;
        const ny=player.y+dy*speed*dt;

        if(canMoveTo(nx,ny)){

            player.x=nx;
            player.y=ny;
        }
    }

    if(player.attackCooldown>0)
        player.attackCooldown-=dt;
}


/* =========================================================
   카메라
========================================================= */

function updateCamera(){

    camera.x=player.x-W/2;
    camera.y=player.y-H/2;
}


/* =========================================================
   렌더링
========================================================= */

function draw(){

    ctx.clearRect(0,0,W,H);

    updateCamera();

    ctx.save();

    ctx.translate(
        -camera.x,
        -camera.y
    );

    drawWorld();
    drawAim();
    drawProjectiles();
    drawEnemies();
    drawPlayer();
    drawParticles();

    ctx.restore();
}


/* =========================================================
   세계
========================================================= */

function drawWorld(){

    /*
      거대한 자연스러운 세계
    */

    ctx.fillStyle="#20251f";

    ctx.fillRect(
        camera.x-2000,
        camera.y-2000,
        W+4000,
        H+4000
    );

    for(const r of regions){

        ctx.save();

        /*
          직사각형 느낌을 줄이기 위해
          둥글고 불규칙한 경계 사용
        */

        ctx.beginPath();

        const x=r.x;
        const y=r.y;
        const w=r.w;
        const h=r.h;

        ctx.moveTo(x+100,y);

        ctx.quadraticCurveTo(
            x+w*.4,
            y-50,
            x+w-100,
            y+30
        );

        ctx.quadraticCurveTo(
            x+w+40,
            y+h*.5,
            x+w-70,
            y+h-40
        );

        ctx.quadraticCurveTo(
            x+w*.5,
            y+h+50,
            x+60,
            y+h-30
        );

        ctx.quadraticCurveTo(
            x-50,
            y+h*.5,
            x+100,
            y
        );

        ctx.closePath();

        ctx.fillStyle=r.color;

        ctx.fill();

        ctx.strokeStyle=
            "rgba(0,0,0,.25)";

        ctx.lineWidth=8;

        ctx.stroke();

        drawRegionDecor(r);

        ctx.restore();
    }

    drawPaths();
}


/* =========================================================
   지역 장식
========================================================= */

function drawRegionDecor(r){

    const count=
        Math.floor(
            Math.min(r.w,r.h)/70
        );

    for(let i=0;i<count;i++){

        const x=
            r.x+40+
            ((i*137)%Math.max(100,r.w-80));

        const y=
            r.y+50+
            ((i*89)%Math.max(100,r.h-100));

        if(r.name==="초원"){
            drawTree(x,y,"#28743a");
        }

        if(r.name==="정글"){
            drawTree(x,y,"#124a28");
            drawTree(x+25,y+20,"#185d31");
        }

        if(r.name==="북극"){
            drawIce(x,y);
        }

        if(
            r.name==="火山" ||
            r.name==="지옥"
        ){
            drawRock(x,y,"#2a1717");
        }
    }

    /*
      물결
    */

    if(r.water){

        ctx.strokeStyle=
            "rgba(255,255,255,.16)";

        ctx.lineWidth=3;

        for(let i=0;i<12;i++){

            const x=r.x+100+(i*123)%(r.w-200);
            const y=r.y+100+(i*71)%(r.h-200);

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                30,
                0,
                Math.PI
            );

            ctx.stroke();
        }
    }

    /*
      화산 지역
    */

    if(
        r.name==="火山"
    ){

        for(let i=0;i<5;i++){

            const x=
                r.x+100+
                i*170;

            const y=
                r.y+200+
                (i%2)*200;

            drawVolcano(x,y);
        }
    }
}


function drawTree(x,y,color){

    ctx.fillStyle="#67422a";

    ctx.fillRect(
        x-5,
        y,
        10,
        25
    );

    ctx.fillStyle=color;

    ctx.beginPath();

    ctx.arc(
        x,
        y-10,
        25,
        0,
        Math.PI*2
    );

    ctx.fill();
}


function drawRock(x,y,color){

    ctx.fillStyle=color;

    ctx.beginPath();

    ctx.moveTo(x-20,y+10);
    ctx.lineTo(x-10,y-15);
    ctx.lineTo(x+15,y-20);
    ctx.lineTo(x+25,y+10);
    ctx.closePath();

    ctx.fill();
}


function drawIce(x,y){

    ctx.fillStyle="#eaffff";

    ctx.beginPath();

    ctx.moveTo(x,y-25);
    ctx.lineTo(x+20,y+20);
    ctx.lineTo(x-20,y+20);
    ctx.closePath();

    ctx.fill();
}


function drawVolcano(x,y){

    ctx.fillStyle="#38211e";

    ctx.beginPath();

    ctx.moveTo(x-70,y+50);
    ctx.lineTo(x-25,y-60);
    ctx.lineTo(x+20,y-60);
    ctx.lineTo(x+75,y+50);
    ctx.closePath();

    ctx.fill();

    ctx.fillStyle="#ff4a19";

    ctx.beginPath();

    ctx.arc(
        x,
        y-45,
        18,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =========================================================
   길
========================================================= */

function drawPaths(){

    ctx.lineWidth=45;
    ctx.lineCap="round";
    ctx.strokeStyle="#b89a62";

    ctx.beginPath();

    ctx.moveTo(-500,500);
    ctx.quadraticCurveTo(
        400,400,
        900,600
    );

    ctx.quadraticCurveTo(
        1300,700,
        1650,500
    );

    ctx.stroke();

    ctx.lineWidth=28;
    ctx.strokeStyle="#d0b477";

    ctx.beginPath();

    ctx.moveTo(500,600);
    ctx.quadraticCurveTo(
        300,1000,
        500,1600
    );

    ctx.stroke();
}


/* =========================================================
   플레이어
========================================================= */

function drawPlayer(){

    const x=player.x;
    const y=player.y;

    /*
      탈것
    */

    if(player.mount){

        if(player.mount==="bike")
            drawBike(x,y);

        if(player.mount==="car")
            drawCar(x,y);

        if(player.mount==="plane")
            drawPlane(x,y);

        if(player.mount==="fighter")
            drawFighter(x,y);
    }

    /*
      캐릭터
    */

    ctx.fillStyle=
        player.color;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        18,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
      머리
    */

    ctx.fillStyle=
        player.gender==="girl"
        ? "#5b321f"
        : "#3b2417";

    ctx.beginPath();

    ctx.arc(
        x,
        y-13,
        13,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();

    /*
      무기
    */

    drawWeapon(
        x,
        y
    );

    /*
      HP
    */

    ctx.fillStyle="#000";

    ctx.fillRect(
        x-22,
        y-38,
        44,
        6
    );

    ctx.fillStyle="#40df55";

    ctx.fillRect(
        x-22,
        y-38,
        44*
        Math.max(
            0,
            player.hp/player.maxHp
        ),
        6
    );
}


/* =========================================================
   무기 그리기
========================================================= */

function drawWeapon(x,y){

    let dx=aim.x-x;
    let dy=aim.y-y;

    const len=Math.hypot(dx,dy)||1;

    dx/=len;
    dy/=len;

    const w=getWeapon();

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(
        Math.atan2(dy,dx)
    );

    ctx.lineCap="round";

    if(w.name==="나무 막대기"){

        ctx.strokeStyle="#754525";
        ctx.lineWidth=7;

        ctx.beginPath();
        ctx.moveTo(10,0);
        ctx.lineTo(48,0);
        ctx.stroke();
    }

    else if(w.name==="돌"){

        ctx.fillStyle="#777";

        ctx.beginPath();
        ctx.arc(35,0,10,0,Math.PI*2);
        ctx.fill();
    }

    else if(w.name==="도끼"){

        ctx.strokeStyle="#754525";
        ctx.lineWidth=5;

        ctx.beginPath();
        ctx.moveTo(8,0);
        ctx.lineTo(48,0);
        ctx.stroke();

        ctx.fillStyle="#777";

        ctx.fillRect(
            35,-13,
            18,26
        );
    }

    else if(
        w.type==="melee"
    ){

        ctx.strokeStyle=
            w.name==="만년필"
            ? "#111"
            : "#d7d7d7";

        ctx.lineWidth=7;

        ctx.beginPath();

        ctx.moveTo(8,0);
        ctx.lineTo(
            Math.min(
                55,
                w.range*.25
            ),
            0
        );

        ctx.stroke();

        if(w.name==="만년필"){

            ctx.fillStyle="#287dff";

            ctx.beginPath();

            ctx.arc(
                50,
                0,
                4,
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    }

    else{

        ctx.fillStyle=
            w.name==="제우스의 번개"
            ? "#ffe84a"
            : "#ddd";

        ctx.fillRect(
            10,
            -5,
            30,
            10
        );
    }

    ctx.restore();
}


/* =========================================================
   탈것
========================================================= */

function drawBike(x,y){

    ctx.strokeStyle="#222";
    ctx.lineWidth=5;

    ctx.beginPath();
    ctx.arc(x-18,y+8,13,0,Math.PI*2);
    ctx.arc(x+18,y+8,13,0,Math.PI*2);
    ctx.stroke();

    ctx.strokeStyle="#d33";

    ctx.beginPath();
    ctx.moveTo(x-18,y+8);
    ctx.lineTo(x,y-10);
    ctx.lineTo(x+18,y+8);
    ctx.lineTo(x-5,y+8);
    ctx.stroke();
}


function drawCar(x,y){

    ctx.fillStyle="#c73737";

    ctx.fillRect(
        x-32,
        y-12,
        64,
        25
    );

    ctx.fillStyle="#a9dfff";

    ctx.fillRect(
        x-18,
        y-25,
        36,
        15
    );

    /*
      크리스마스 이벤트라면
      자동차에 산타썰매 스킨을 입힌 모습.
    */

    if(
        getEvent()==="christmas"
    ){

        ctx.fillStyle="#ffdf46";

        ctx.fillRect(
            x-37,
            y+10,
            74,
            5
        );

        ctx.fillStyle="#fff";

        ctx.fillRect(
            x-30,
            y-30,
            60,
            5
        );
    }
}


function drawPlane(x,y){

    ctx.fillStyle="#ddd";

    ctx.beginPath();

    ctx.moveTo(x+40,y);
    ctx.lineTo(x-30,y-15);
    ctx.lineTo(x-10,y);
    ctx.lineTo(x-30,y+15);
    ctx.closePath();

    ctx.fill();
}


function drawFighter(x,y){

    ctx.fillStyle="#555";

    ctx.beginPath();

    ctx.moveTo(x+45,y);
    ctx.lineTo(x-30,y-10);
    ctx.lineTo(x-15,y);
    ctx.lineTo(x-30,y+10);
    ctx.closePath();

    ctx.fill();

    ctx.fillStyle="#ff3b30";

    ctx.fillRect(
        x-20,
        y-3,
        15,
        6
    );
}


/* =========================================================
   조준 사거리
========================================================= */

function drawAim(){

    if(!aim.active)
        return;

    const w=getWeapon();

    const dx=aim.x-player.x;
    const dy=aim.y-player.y;

    const angle=Math.atan2(dy,dx);

    ctx.save();

    ctx.strokeStyle=
        "rgba(255,255,255,.4)";

    ctx.lineWidth=2;

    ctx.setLineDash([8,8]);

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        w.range,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        player.x,
        player.y
    );

    ctx.lineTo(
        player.x+
        Math.cos(angle)*w.range,
        player.y+
        Math.sin(angle)*w.range
    );

    ctx.stroke();

    ctx.setLineDash([]);

    ctx.restore();
}


/* =========================================================
   몬스터 렌더링
========================================================= */

function drawEnemies(){

    for(const e of enemies){

        const base=monsters[e.type];

        ctx.save();

        ctx.translate(e.x,e.y);

        /*
          피격 효과
        */

        if(e.hitFlash>0)
            ctx.globalAlpha=.55;

        ctx.fillStyle=base.color;

        if(e.type==="slime" ||
           e.type==="royalSlime" ||
           e.type==="frostSlime"){

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                base.size,
                0,
                Math.PI*2
            );

            ctx.fill();

            /*
              눈
            */

            ctx.fillStyle="#111";

            ctx.beginPath();
            ctx.arc(-6,-4,3,0,Math.PI*2);
            ctx.arc(6,-4,3,0,Math.PI*2);
            ctx.fill();
        }

        else if(
            e.type==="phoenix"
        ){

            ctx.beginPath();

            ctx.moveTo(0,-base.size);
            ctx.lineTo(base.size,base.size);
            ctx.lineTo(0,base.size/2);
            ctx.lineTo(-base.size,base.size);
            ctx.closePath();

            ctx.fill();
        }

        else{

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                base.size,
                0,
                Math.PI*2
            );

            ctx.fill();

            /*
              악마/오니 뿔
            */

            if(
                e.type.includes("demon") ||
                e.type==="oni"
            ){

                ctx.fillStyle="#222";

                ctx.beginPath();

                ctx.moveTo(-12,-base.size+5);
                ctx.lineTo(-5,-base.size-12);
                ctx.lineTo(0,-base.size+5);

                ctx.moveTo(12,-base.size+5);
                ctx.lineTo(5,-base.size-12);
                ctx.lineTo(0,-base.size+5);

                ctx.fill();
            }
        }

        /*
          보스 링
        */

        if(base.boss){

            ctx.strokeStyle="#ffd83d";
            ctx.lineWidth=3;

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                base.size+8,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }

        ctx.restore();

        /*
          HP bar
        */

        ctx.fillStyle="#000";

        ctx.fillRect(
            e.x-base.size,
            e.y-base.size-12,
            base.size*2,
            5
        );

        ctx.fillStyle=
            base.boss
            ? "#ffca28"
            : "#ef4444";

        ctx.fillRect(
            e.x-base.size,
            e.y-base.size-12,
            base.size*2*
            Math.max(
                0,
                e.hp/e.maxHp
            ),
            5
        );

        /*
          보스 이름
        */

        if(base.boss){

            ctx.fillStyle="#fff";
            ctx.font="bold 12px Arial";
            ctx.textAlign="center";

            ctx.fillText(
                "👑 "+base.name,
                e.x,
                e.y-base.size-18
            );
        }
    }
}


/* =========================================================
   투사체 렌더링
========================================================= */

function drawProjectiles(){

    for(const p of projectiles){

        ctx.fillStyle=
            p.type==="lightning"
            ? "#fff04a"
            : "#ffb52e";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            7,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}


/* =========================================================
   파티클 렌더링
========================================================= */

function drawParticles(){

    for(const p of particles){

        ctx.globalAlpha=
            Math.max(
                0,
                p.life*2
            );

        ctx.fillStyle=p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            3,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.globalAlpha=1;
}


/* =========================================================
   UI
========================================================= */

function updateUI(){

    document.getElementById("levelText")
        .textContent=player.level;

    document.getElementById("coinText")
        .textContent=player.coins;

    document.getElementById("lpText")
        .textContent=player.lp;

    document.getElementById("starText")
        .textContent=player.stars;

    document.getElementById("hpText")
        .textContent=
        `${Math.max(0,Math.floor(player.hp))} / ${player.maxHp}`;

    document.getElementById("hpFill")
        .style.width=
        Math.max(
            0,
            player.hp/player.maxHp*100
        )+"%";

    document.getElementById("xpFill")
        .style.width=
        (
            player.level>=2000
            ?100
            :player.xp/xpNeeded()*100
        )+"%";

    document.getElementById("weaponText")
        .textContent=getWeapon().name+
        ` +${player.weaponUpgrade}`;

    document.getElementById("weaponInfo")
        .innerHTML=`
            공격력: ${Math.floor(getDamage())}<br>
            사거리: ${getWeapon().range}<br>
            타입: ${getWeapon().type}
        `;

    document.getElementById("mountText")
        .textContent=
        player.mount
        ? mounts[player.mount].name
        :"없음";

    document.getElementById("genderText")
        .textContent=
        player.gender==="boy"
        ?"남자아이"
        :player.gender==="girl"
        ?"여자아이"
        :"캐릭터";

    const r=getRegion(
        player.x,
        player.y
    );

    document.getElementById("regionText")
        .textContent=r.name;
}


/* =========================================================
   메시지
========================================================= */

let messageTimer=0;

function showMessage(text){

    const el=document.getElementById("message");

    el.textContent=text;

    el.classList.add("show");

    messageTimer=2;
}


/* =========================================================
   모달
========================================================= */

function closeModal(id){

    document.getElementById(id)
        .classList.remove("show");
}


/* =========================================================
   게임 루프
========================================================= */

let lastTime=performance.now();

function loop(now){

    const dt=
        Math.min(
            .033,
            (now-lastTime)/1000
        );

    lastTime=now;

    updatePlayer(dt);

    for(const e of enemies)
        updateEnemy(e,dt);

    updateProjectiles(dt);
    updateParticles(dt);

    /*
      몬스터 수 제한
    */

    if(enemies.length<18){
        if(Math.random()<dt*.8)
            randomSpawn();
    }

    /*
      오래된 몬스터를 너무 많이 멀리 보내지 않음
    */

    enemies=enemies.filter(e=>{

        const d=Math.hypot(
            e.x-player.x,
            e.y-player.y
        );

        return d<2500;
    });

    if(messageTimer>0){

        messageTimer-=dt;

        if(messageTimer<=0){

            document
                .getElementById("message")
                .classList.remove("show");
        }
    }

    updateUI();
    draw();

    requestAnimationFrame(loop);
}


/* =========================================================
   초기화
========================================================= */

loadGame();

if(!player.gender){

    document.getElementById("genderModal")
        .classList.add("show");
}

updateUI();

aim.x=player.x+100;
aim.y=player.y;

requestAnimationFrame(loop);


/* =========================================================
   자동 저장
========================================================= */

setInterval(()=>{
    saveGame();
},30000);

</script>
